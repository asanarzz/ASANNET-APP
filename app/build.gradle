plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.kafinet.asannet'
    compileSdk 34

    defaultConfig {
        applicationId "com.kafinet.asannet"
        minSdk 26
        targetSdk 34
        versionCode 119
        versionName "3.8.4"
    }

    signingConfigs {
        release {
            // این مقادیر هیچ‌وقت مستقیم تو کد نوشته نمی‌شن — موقع بیلد از
            // متغیرهای محیطی (که GitHub Actions از GitHub Secrets پر می‌کنه) خونده می‌شن.
            storeFile file(System.getenv("KAFINET_KEYSTORE_PATH") ?: "kafinet-release.keystore")
            storePassword System.getenv("KAFINET_KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KAFINET_KEY_ALIAS") ?: "kafinet"
            keyPassword System.getenv("KAFINET_KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        debug {
            // نوع دیباگ از کلید موقت و خودکار خودِ اندروید استفاده می‌کنه، نیازی به تنظیم نداره
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'androidx.media:media:1.7.0'
   implementation 'androidx.media3:media3-exoplayer:1.4.1'
implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
}
