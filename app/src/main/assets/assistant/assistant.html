<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دستیار آسان‌نت</title>
<style>
  :root { --brand:#4f3fc4; --brand2:#6b72f0; --bg:#f4f4fb; --card:#fff; --text:#1d1b33; --muted:#6c6a85; --user:#e5e3ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 16px/1.8 "Vazirmatn", Tahoma, "Noto Sans Arabic", system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; }
  header { background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #fff; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header button { border: 0; background: rgba(255,255,255,.2); color: #fff; border-radius: 10px; min-width: 40px; min-height: 36px; font-size: 18px; }
  header p { margin: 0; font-size: 13px; opacity: .95; }
  #log { flex: 1; overflow-y: auto; padding: 14px 12px; }
  .row { display: flex; margin-bottom: 10px; }
  .row.user { justify-content: flex-start; }
  .row.bot { justify-content: flex-end; }
  .bubble { max-width: 88%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user .bubble { background: var(--user); border-bottom-right-radius: 4px; }
  .bot .bubble { background: var(--card); border: 1px solid #e3e1f5; border-bottom-left-radius: 4px; }
  .dots span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: var(--muted); animation: b 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes b { 0%,80%,100% { opacity: .25 } 40% { opacity: 1 } }
  #chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 8px; }
  #chips button { flex: none; border: 1px solid #cfcbf3; background: #fff; color: var(--brand); border-radius: 999px; padding: 8px 14px; min-height: 40px; font: inherit; font-size: 14px; }
  form { display: flex; gap: 8px; padding: 8px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid #e3e1f5; }
  textarea { flex: 1; resize: none; border: 1px solid #cfcbf3; border-radius: 14px; padding: 10px 12px; font: inherit; min-height: 46px; max-height: 120px; }
  button.send { width: 48px; height: 48px; border: 0; border-radius: 50%; background: var(--brand); color: #fff; font-size: 20px; flex: none; }
  .note { text-align: center; font-size: 12px; color: var(--muted); padding: 0 12px 6px; }
</style>
</head>
<body>
<header><p>دربارهٔ خدمات و برنامه بپرسید، یا فقط گپ بزنید 😊</p><button type="button" id="clr" aria-label="پاک کردن گفتگو" title="پاک کردن گفتگو">🗑</button></header>
<main id="log" role="log" aria-live="polite"></main>
<div id="chips" aria-label="پرسش‌های پیشنهادی"></div>
<div class="note">گفتگوی شما فقط روی همین گوشی ذخیره می‌شود و برای ادمین ارسال نمی‌شود.</div>
<form id="f">
  <textarea id="t" rows="1" maxlength="300" placeholder="پیام خود را بنویسید…" aria-label="پیام"></textarea>
  <button class="send" id="s" type="submit" aria-label="ارسال">➤</button>
</form>

<script src="data/proverbs.js"></script>
<script src="data/facts.js"></script>
<script src="data/jokes.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════════
   دستیار آسان‌نت — ربات محلی (بدون هوش مصنوعی، بدون سرور، بدون اینترنت)
   فقط به چیزهایی جواب می‌دهد که در همین فایل نوشته‌اید.
   بخش «۱) تنظیمات» و «۲) خدمات» و «۳) موضوع‌ها» را ویرایش کنید.
   ═══════════════════════════════════════════════════════════════ */

/* ───── ۱) تنظیمات ───── */
var CONFIG = {
  brand: 'کافی‌نت آسان‌نت',
  docs: 'ارسال مدارک',                 // کاشی صفحهٔ اصلی برنامه
  support: 'پیام به پشتیبانی',          // گزینهٔ منوی کناری (☰)
  contactMenu: 'راه‌های ارتباطی',       // گزینهٔ منوی کناری (☰)
  eitaaAdmin: '@ASAN_NETT',            // ادمین در ایتا
  eitaaChannel: '@ASANNETT',           // کانال در ایتا
  hours: 'هر روز از ۸ صبح تا ۲۲ شب',
  phone: '',
  address: ''                          // خالی: کار غیرحضوری و مجازی است
};

/* ───── ۲) خدمات (از فهرست «کلیه خدمات» و بنرهای برنامه) ─────
   keywords : کلمه‌هایی که کاربر برای این خدمت می‌نویسد
   bring    : مدارک لازم (اگر خالی باشد ربات نمی‌گوید؛ ادمین اعلام می‌کند)
   قیمت و زمان انجام را ربات هرگز نمی‌گوید؛ ادمین اعلام می‌کند. */
var SERVICES = [
  { name: 'خدمات بیمه (شخص ثالث خودرو و موتور، زنان خانه‌دار، تأمین اجتماعی، بیمه سلامت)', keywords: ['بیمه', 'بیمه ها'], bring: '' },
  { name: 'ثبت‌نام وام و تسهیلات', keywords: ['وام', 'وام ها', 'تسهیلات', 'وام ازدواج', 'وام قرض الحسنه', 'وام بانکی'], bring: '' },
  { name: 'یارانه و کالابرگ (اصلاح ساختار خانوار، اعتراض به دهک‌بندی، درخواست یارانه و کالابرگ)', keywords: ['کالابرگ', 'کالا برگ', 'یارانه', 'یارانه نقدی', 'دهک', 'دهک بندی', 'ساختار خانوار', 'اعتراض دهک'], bring: '' },
  { name: 'بیمه‌نامه شخص ثالث خودرو و موتورسیکلت', keywords: ['بیمه خودرو', 'بیمه موتور', 'بیمه ماشین', 'بیمه موتورسیکلت', 'شخص ثالث', 'بیمه نامه', 'بیمه اقساطی', 'بیمه شخص ثالث'], bring: '' },
  { name: 'نوبت‌دهی تعویض پلاک، گواهی عدم سوء پیشینه و خلافی خودرو', keywords: ['پلاک', 'تعویض پلاک', 'نوبت دهی پلاک', 'خلافی', 'خلافی خودرو', 'سوء پیشینه', 'عدم سوء پیشینه', 'ثبت نام خودرو', 'ثبت نام ماشین', 'ایران خودرو', 'ایرانخودرو', 'سایپا', 'قرعه کشی خودرو'], bring: '' },
  { name: 'پرداخت مالیات و عوارض خودرو', keywords: ['مالیات خودرو', 'عوارض خودرو', 'عوارض', 'عوارض ماشین', 'مالیات ماشین'], bring: '' },
  { name: 'ثبت‌نام لاستیک دولتی', keywords: ['لاستیک', 'لاستیک دولتی', 'لاستیک ارزان'], bring: '' },
  { name: 'ثبت‌نام کارت سوخت', keywords: ['کارت سوخت', 'سوخت'], bring: '' },

  { name: 'ثبت اجاره‌نامه با کد رهگیری', keywords: ['اجاره نامه', 'قرارداد اجاره', 'کد رهگیری', 'اجاره', 'مستاجر', 'موجر'], bring: '' },
  { name: 'بیمه زنان خانه‌دار (تأمین اجتماعی)', keywords: ['بیمه زنان خانه دار', 'زنان خانه دار', 'بیمه خانه دار', 'بیمه دختران', 'خانه دار'], bring: '' },
  { name: 'خدمات تأمین اجتماعی (سوابق بیمه، ثبت‌نام در سامانه، افزودن افراد تحت پوشش، ثبت حساب بانکی)', keywords: ['تامین اجتماعی', 'سوابق بیمه', 'سابقه بیمه', 'سامانه تامین اجتماعی', 'بیمه سرپرست خانوار', 'تحت پوشش', 'حساب بانکی تامین'], bring: '' },
  { name: 'صدور گواهی کسر از حقوق بازنشستگان', keywords: ['گواهی کسر از حقوق', 'کسر از حقوق', 'بازنشسته', 'بازنشستگان', 'بازنشستگی'], bring: '' },
  { name: 'بیمه سلامت و روستایی، بیمه ورزشی و نوبت‌دهی دکتر', keywords: ['بیمه سلامت', 'بیمه روستایی', 'دفترچه', 'دفترچه بیمه', 'بیمه درمانی', 'بیمه ورزشی', 'نوبت دکتر', 'نوبت دهی دکتر', 'دکتر'], bring: '' },
  { name: 'پیش‌ثبت‌نام کلاس اولی‌ها', keywords: ['پیش ثبت نام', 'کلاس اولی', 'کلاس اول', 'ثبت نام اول دبستان', 'ثبت نام مدرسه', 'پیش ثبت نام دانش آموز'], bring: '' },
  { name: 'سنجش بدو ورود دانش‌آموزان (پیش‌دبستانی)', keywords: ['سنجش', 'سنجش بدو ورود', 'سنجش سلامت', 'پیش دبستانی', 'نوآموز', 'بدو ورود'], bring: '' },
  { name: 'فرم آگاهی از سلامت دانش‌آموزان', keywords: ['فرم آگاهی', 'آگاهی از سلامت', 'فرم سلامت', 'فرم سلامت دانش آموز'], bring: '' },
  { name: 'آزمون غربالگری و استعدادیابی دانش‌آموزان', keywords: ['غربالگری', 'استعداد یابی', 'استعدادیابی', 'آزمون غربالگری', 'آزمون استعداد', 'سلامت روان'], bring: '' },
  { name: 'ساخت آزمون و پرسشنامهٔ اینترنتی برای معلمان', keywords: ['ساخت آزمون', 'آزمون اینترنتی', 'پرسشنامه', 'معلم', 'معلمان', 'آزمون معلم'], bring: '' },
  { name: 'خدمات دانش‌آموزی و آموزش و پرورش', keywords: ['دانش آموز', 'دانش آموزی', 'آموزش و پرورش', 'مدرسه', 'دبستان', 'دبیرستان'], bring: '' },
  { name: 'ثبت‌نام دانشگاهی و انتخاب رشته', keywords: ['ثبت نام دانشگاه', 'دانشگاه', 'انتخاب رشته', 'دانشگاهی'], bring: '' },
  { name: 'ثبت‌نام کنکور', keywords: ['کنکور', 'سازمان سنجش', 'آزمون سراسری'], bring: '' },
  { name: 'ثبت‌نام مددجویان کمیته امداد', keywords: ['کمیته امداد', 'مددجو', 'مددجویان', 'امداد'], bring: '' },
  { name: 'ثبت درخواست واگذاری زمین روستایی', keywords: ['زمین روستایی', 'واگذاری زمین', 'زمین', 'روستا'], bring: '' },
  { name: 'ثبت‌نام گذرنامه زیارتی', keywords: ['گذرنامه', 'پاسپورت', 'گذرنامه زیارتی', 'زیارتی', 'کربلا', 'اربعین'], bring: '' },
  { name: 'دریافت کد مالیاتی و تشکیل پرونده مالیاتی', keywords: ['کد مالیاتی', 'پرونده مالیاتی', 'مالیات', 'مغازه دار', 'شناسه مالیاتی'], bring: '' },
  { name: 'ارائه گزارش اعتباری (گزارش و امتیاز اعتباری، وضعیت چک)', keywords: ['گزارش اعتباری', 'امتیاز اعتباری', 'اعتبارسنجی', 'وضعیت چک', 'چک برگشتی', 'سوابق اعتباری'], bring: '' },

  { name: 'خدمات پستی و کد پستی', keywords: ['کد پستی', 'خدمات پستی', 'پیگیری مرسوله', 'مرسوله پستی', 'احراز نشانی', 'گواهی کد پستی', 'پست'], bring: '' },
  { name: 'تبدیل و تغییر فایل‌ها (ویدئو به صوت، PDF به عکس و برعکس، تغییر حجم تصویر، برش فایل صوتی و تصویری)', keywords: ['تبدیل فایل', 'تبدیل pdf', 'pdf به عکس', 'عکس به pdf', 'تغییر حجم', 'کم کردن حجم', 'ویدئو به صوت', 'برش فایل', 'تغییر اندازه عکس', 'تبدیل'], bring: '' },
  { name: 'ساخت بنر، پوستر و استیکر کارت بانکی ایتا', keywords: ['بنر', 'پوستر', 'استیکر', 'اسنیکر', 'استیکر کارت', 'طراحی بنر', 'بنر تبلیغاتی'], bring: '' }
];

// دکمه‌های پیشنهادی (هر کدام باید خودش یک جملهٔ قابل فهم برای ربات باشد)
var START_CHIPS = ['کالابرگ و یارانه', 'بیمه خودرو', 'ثبت‌نام خودرو', 'مدارک را چطور بفرستم؟', 'سرگرمی', 'ساعت چنده؟'];

/* ───── ۳) موضوع‌های دیگر (برنامه، پشتیبانی، آگهی، حساب و …) ─────
   جواب‌ها فقط چیزهایی هستند که در کد برنامه دیده شده؛ هر چه مطمئن نیستید ننویسید.
   {docs} {support} {contactMenu} {brand} {contact} {services_list} جایگزین می‌شوند. */
var TOPICS = [
  { id: 'docs', keywords: ['ارسال مدارک', 'مدارک رو کجا', 'مدارک را کجا', 'مدارکم رو', 'مدارک بفرستم', 'مدارک ارسال', 'فرستادن مدارک', 'مدارک را چطور', 'چطور مدارک', 'مدارک رو چطور', 'مدرک بفرستم', 'مدرک ارسال', 'مشخصات بفرستم', 'مشخصات ارسال'],
    answer: 'از صفحهٔ اصلی برنامه وارد «{docs}» شوید:\n۱) نام، نام خانوادگی، کد ملی (۱۰ رقم)، شمارهٔ موبایل (با ۰۹) و تاریخ تولد متقاضی را وارد کنید.\n۲) با «افزودن مدرک» عکس یا فایل مدارکتان را اضافه کنید (تا ۱۰ مدرک) و برای هر کدام یک توضیح بنویسید، مثلاً «کارت ملی».\n۳) «ارسال مدرک» را بزنید.\nبعد از آن ادمین بررسی می‌کند و نتیجه و هزینه را به شما اعلام می‌کند. لطفاً این اطلاعات را فقط در همان بخش وارد کنید، نه در گفتگو با دستیار.' },
  { id: 'services', keywords: ['چه خدماتی', 'خدمات شما', 'چه کارهایی', 'چکار می کنید', 'چه کاری انجام', 'کارهای شما', 'کلیه خدمات', 'همه خدمات', 'خدمات'],
    answer: '{services_list}' },
  { id: 'support', keywords: ['پشتیبانی', 'پیام به پشتیبانی', 'با ادمین', 'ادمین', 'اپراتور', 'سوال دارم از شما', 'جواب سوالم'],
    answer: 'برای صحبت با ادمین، از منوی ☰ بالای صفحهٔ اصلی گزینهٔ «{support}» را بزنید؛ می‌توانید متن یا فایل بفرستید و جواب ادمین همان‌جا می‌آید. (برای استفاده از آن باید وارد حساب‌تان باشید.)' },
  { id: 'contact', keywords: ['شماره تماس', 'شماره تلفن', 'تلفن', 'تماس با شما', 'ارتباط با شما', 'راه ارتباطی', 'راه های ارتباطی', 'ایتا', 'ایتا ادمین', 'آیدی ایتا', 'آیدی ادمین', 'آیدی', 'کانال', 'آدرس کافی نت', 'نشانی', 'آدرس', 'کجا هستید', 'ساعت کاری', 'ساعت کار', 'مراجعه حضوری', 'حضوری بیام'],
    answer: '{contact}' },
  { id: 'about', keywords: ['دولتی', 'وابسته', 'رسمی', 'کافی نت خصوصی', 'شما کی هستید', 'آسان نت چیست', 'درباره آسان نت', 'درباره شما'],
    answer: '{brand} یک کافی‌نت خصوصی است و وابسته به هیچ نهاد دولتی نیست. ما کارهای اینترنتی شما را (از طریق همین برنامه) انجام می‌دهیم تا لازم نباشد در صف و رفت‌وآمد وقت تلف کنید.' },
  { id: 'register', keywords: ['ثبت نام در برنامه', 'ثبت نام در اپ', 'حساب بسازم', 'اکانت', 'حساب کاربری', 'ورود به برنامه', 'نمیتونم وارد', 'نمی تونم وارد', 'وارد برنامه'],

  { id: 'forgot', keywords: ['فراموشی رمز', 'رمز رو فراموش', 'رمز را فراموش', 'رمزم رو فراموش', 'رمزم رو یادم', 'رمز عبور', 'رمز', 'بازیابی رمز', 'تغییر رمز'],

  { id: 'token', keywords: ['توکن', 'قفل', 'محتوای قفل', 'قفل شده', 'قفله'],

function norm(s) {
  return String(s || '')
    .replace(/[يى]/g, 'ی').replace(/ك/g, 'ک').replace(/[ۀة]/g, 'ه')
    .replace(/[‌‏‎_\-]+/g, ' ')
    .replace(/[ً-ٰٟ]/g, '')
    .replace(/[۰-۹]/g, function (d) { return String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); })
    .replace(/[٠-٩]/g, function (d) { return String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)); })
    .replace(/[؟?!.,،؛:"'()«»\[\]]+/g, ' ')
    .toLowerCase().replace(/\s+/g, ' ').trim();
}
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 1) return 2;
  var prev = [], i, j;
  for (j = 0; j <= b.length; j++) prev[j] = j;
  for (i = 1; i <= a.length; i++) {
    var cur = [i];
    for (j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
// امتیاز تطبیق یک متن با فهرست کلمه‌ها
function score(text, keywords) {
  var tokens = text.split(' '), nospace = text.replace(/ /g, ''), total = 0;
  for (var i = 0; i < keywords.length; i++) {
    var k = norm(keywords[i]); if (!k) continue;
    var kn = k.replace(/ /g, '');
    if (k.indexOf(' ') === -1) {
      if (k.length <= 3) { if (tokens.indexOf(k) !== -1) total += k.length; continue; }   // کلمه‌های کوتاه فقط به‌صورت کامل
      if (text.indexOf(k) !== -1) { total += k.length; continue; }
      for (var j = 0; j < tokens.length; j++) if (tokens[j].length >= 5 && lev(tokens[j], k) <= 1) { total += k.length * 0.8; break; }
    } else if (text.indexOf(k) !== -1 || nospace.indexOf(kn) !== -1) { total += k.length; continue; }
    // غلط املایی یک‌حرفی، حتی وقتی فاصلهٔ کلمه‌ها اشتباه است («کالا برک»)
    if (kn.length >= 6) {
      for (var w = -1; w <= 0; w++) {
        var L = kn.length + w, hit = false;
        for (var a = 0; a + L <= nospace.length; a++) if (lev(nospace.substr(a, L), kn) <= 1) { hit = true; break; }
        if (hit) { total += kn.length * 0.8; break; }
      }
    }
  }
  return total;
}

  return bs >= 3 ? best : null;
}

  if (/(تاریخ (امروز|الان|شمسی|میلادی|قمری)|امروز چندمه|امروز چند شنبه|امروز چه روز|امروز چندم|چند شنبه|چه تاریخی|تاریخ چنده|چندم ماهه|تاریخ رو بگو|روز هفته)/.test(text)) {

  if ((m = /(?:متولد|تولد|سالمه|سن)\D{0,12}(1[3-4]\d\d|19\d\d|20[0-2]\d)/.exec(text)) && /(چند|سال|سن)/.test(text)) { var ag = TOOLS.age(+m[1]); if (ag) return xr(ag); }

  if (/(مسابقه|سوال بپرس|سوالی بپرس|کوییز|کویز|از من سوال|بپرس ازم)/.test(text)) { var qz = TOOLS.bag('quiz', QUIZ); xs.game = { type: 'qa', item: qz, tries: 0 }; return xr('🏆 سؤال: ' + qz.q + '\n(جواب را بنویسید یا بگویید «جواب»)', ['جواب', 'خروج']); }
  if (/^(بازی|بازی کنیم|بازی چی داری|بازی دارید|بریم بازی|بازی ها|بازی بلدی|بازی میکنی|بازی می کنی)( کنیم| داری| میکنی)?$/.test(text) || /(بازی کنیم|بازی بلدی|بازی داری|چه بازی)/.test(text)) return xr('بازی‌هایی که بلدم:\n🎯 حدس عدد\n✊ سنگ‌کاغذ‌قیچی\n🧩 معما\n🏆 مسابقهٔ اطلاعات عمومی\nیکی را انتخاب کنید!', ['بازی حدس عدد', 'سنگ کاغذ قیچی', 'یه معما بگو', 'مسابقه']);
  // سرگرمی
  if (/^(نسخه|ورژن|version)( ربات| دستیار| برنامه)?$/.test(text)) return xr('نسخه‌ی دستیار: ۲۰۲۶.۱۰.۲۸ — جوک‌های قدیمی: ' + JOKES.length + '، جوک‌های جدید: ' + JOKES_NEW.length + ' — ضرب‌المثل: ' + PROVERBS.length + '، دانستنی: ' + FACTS.length, ['جوک جدید']);
  if (/(جوک|لطیفه).*(جدید|تازه|نو|روز|امروز|روزانه)|(جدید|تازه|نو|روز|امروز).*(جوک|لطیفه)/.test(text)) return xr('🆕 ' + newestJoke(), ['جوک جدید', 'یه جوک دیگه', 'فال حافظ']);
  if (/(جوک|لطیفه|بخندون|خنده دار|یه چیز بامزه|شوخی کن|بامزه بگو)/.test(text)) { var jk = Math.random() < 0.5 ? newestJoke() : TOOLS.bag('joke', JOKES); return xr(jk, ['یه جوک دیگه', 'جوک جدید', 'فال حافظ']); }
  if (/(^| )(فال|تفال|فالم)( |$)|فال حافظ|حافظ/.test(text)) { var h = TOOLS.bag('hafez', HAFEZ); return xr('🌹 فال شما (با نیت خود):\n\n' + h[0] + '\n\nتعبیر: ' + h[1], ['دوباره فال', 'یه جوک بگو', 'شعر بخون']); }
  if (/(شعر|بیت|سعدی|فردوسی|شاعر)/.test(text) && !/(شعر.*(خدمات|ثبت))/.test(text)) return xr(TOOLS.bag('poem', POEMS), ['شعر دیگه', 'فال حافظ']);

  if (/(جمله انگیزشی|انگیزشی|انگیزه بده|متن انگیزشی|حرف قشنگ|جمله زیبا|جمله قشنگ|دلگرمی|دلداری|روحیه بده|یه جمله)/.test(text)) return xr(TOOLS.bag('quote', QUOTES), ['یه جمله دیگه', 'یه جوک بگو']);
  if (/(دانستنی|اطلاعات جالب|چیز جالب|نکته جالب|جالب بگو|میدونستی|می دونستی|خبر جالب|یه چیز جدید|اطلاعات عمومی)/.test(text)) { var fc = TOOLS.bag('fact', FACTS); return xr(/^[^؀-ۿ\w\s]/.test(fc) ? 'می‌دانستید؟\n' + fc : '💡 می‌دانستید؟ ' + fc, ['یه دانستنی دیگه', 'مسابقه']); }
  if (/(زبان ?پیچ|زبان ?گردان|ورد زبان)/.test(text)) return xr(TOOLS.bag('tw', TWISTERS));
  // شانس
  if (/(سکه بنداز|سکه پرت|شیر یا خط|شیر خط|سکه بزن)/.test(text)) return xr('🪙 ' + (TOOLS.rnd(2) ? 'شیر' : 'خط') + ' آمد!', ['دوباره سکه بنداز', 'تاس بنداز']);
  if (/(^| )(تاس|طاس)( |$)/.test(text)) { var dc = 1 + TOOLS.rnd(6); return xr('🎲 تاس: ' + TOOLS.fa(dc), ['تاس بنداز', 'سکه بنداز']); }
  if (/(عدد تصادفی|عدد شانسی|عدد رندوم|یه عدد بگو|یک عدد بگو|یه عدد بده|عدد بگو)/.test(text)) {
    var lo = 1, hi = 100, rg = /(\d+)\s*(?:تا|و|الی)\s*(\d+)/.exec(text);
    if (rg) { lo = Math.min(+rg[1], +rg[2]); hi = Math.max(+rg[1], +rg[2]); }
    return xr('🎰 عدد شانسی شما: ' + TOOLS.fa(lo + TOOLS.rnd(hi - lo + 1)) + ' (بین ' + TOOLS.fa(lo) + ' و ' + TOOLS.fa(hi) + ')');
  }
  if (/(انتخاب کن|قرعه|یکیشو انتخاب|کدوم رو انتخاب|یکی رو انتخاب|یکی را انتخاب|کدومو|برام انتخاب|یکی رو بگو)/.test(text)) {
    var ot = text.replace(/(بین|انتخاب کن|برام|برایم|یکی رو|یکی را|یکی|قرعه کشی|قرعه|کن|بگو|رو|را|انتخاب|کدوم|کدومو|ازین|از این|از بین|از)/g, ' ').split(/ و | یا |،|,/).map(function (x) { return x.trim(); }).filter(function (x) { return x; });
    if (ot.length >= 2) return xr('🎯 انتخاب من: «' + ot[TOOLS.rnd(ot.length)] + '»', ['دوباره انتخاب کن', 'سکه بنداز']);
    return xr('گزینه‌ها را بنویسید، مثلاً: «بین پیتزا و کباب و ساندویچ انتخاب کن»');
  }
  // نام
  if ((m = /^(?:اسمم|اسم من|اسم|من)\s+(\S{2,14}?)(?:\s*(?:هستم|هست|ه|ام|است))?$/.exec(text)) && /^(اسمم|اسم من|اسم)/.test(text) || (m = /^من\s+(\S{2,14})\s+هستم$/.exec(text)) && !/^(خسته|خوب|ناراحت|مشتری|کاربر|دانشجو|دانش|معلم|بازنشسته)/.test(m[1])) {
    if (m && m[1] && !/^(چیه|چیست|چی|کیه)$/.test(m[1])) { xs.name = m[1]; return xr('خوشبختم ' + xs.name + ' جان! 🌹 چه کمکی از من برمی‌آید؟', suggestions()); }
  }

}

function weatherReply(city, text) {
  var day = /(پس فردا)/.test(text) ? 2 : /(فردا)/.test(text) ? 1 : 0;
  return { text: '⏳ دارم وضعیت هوای ' + city + ' را می‌گیرم…', promise: TOOLS.weather(city, day).then(function (r) { r.chips = FUN_CHIPS; return r; }) };
}

function replyCore(raw) {
  var text = norm(raw);
  if (!text) return { text: 'پیام شما خالی است.', chips: suggestions() };

  // بازی در جریان، ماشین‌حساب، تبدیل واحد و عدد به حروف (قبل از هشدار اطلاعات شخصی)
  var pre = EXTRAS_PRE(text, raw); if (pre) { pre.tool = true; return pre; }

  // سلام و احوال‌پرسی در بخش CHAT (بالای فایل) است
  if (text.split(' ').length <= 3 && /(خداحافظ|فعلا|بای)/.test(text)) return { text: 'موفق باشید! هر وقت سؤالی داشتید بپرسید.', chips: [] };

  // سرگرمی و ابزارها: ساعت، تاریخ، هوا، بازی، جوک، فال و …
  var mainx = EXTRAS_MAIN(text, raw); if (mainx) return mainx;

  // گپ و گفت روزمره (فقط پیام‌های کوتاهی که نام خدمت ندارند)
  if (text.split(' ').length <= 6 && !findService(text)) {
    for (var ci = 0; ci < CHAT.length; ci++) {
      if (CHAT[ci].re.test(text)) { var ca = CHAT[ci].a; return { text: fill(ca[Math.floor(Math.random() * ca.length)]), chips: suggestions() }; }
    }
  }

  var svc = findService(text);
  var isPrice = PRICE.test(text), isTime = TIME.test(text), isDoc = DOCQ.test(text);

  // «قیمت دلار» و مشابه: ربطی به خدمات ندارد
  if (!svc && /(دلار|طلا|سکه|ارز)/.test(text) && isPrice) return pick('dollar');

  // پرسش بدون نام خدمت، دنبالهٔ خدمت قبلی (مثلاً «قیمتش چنده؟»)
  if (!svc && (isPrice || isTime || isDoc) && ctx.service) svc = ctx.service;

  var cta = 'مشخصات و مدارکتان را از بخش «' + CONFIG.docs + '» صفحهٔ اصلی برنامه برای ادمین بفرستید تا ادمین پیگیری کند.';

  if (svc) {
    ctx.service = svc;
    var out;
    if (isPrice) out = 'هزینهٔ ' + svc.name + ' را ادمین بعد از بررسی مدارک شما اعلام می‌کند. ' + cta;
    else if (isTime) out = 'زمان انجام ' + svc.name + ' را ادمین بعد از بررسی مدارک شما اعلام می‌کند. ' + cta;
    else if (isDoc) out = svc.bring ? 'مدارک لازم برای ' + svc.name + ': ' + svc.bring + '. ' + cta
      : 'ابتدا مشخصات خود را از بخش «' + CONFIG.docs + '» صفحهٔ اصلی بفرستید؛ ادمین مدارک لازم برای ' + svc.name + ' را به شما اعلام می‌کند.';
    else out = svc.name + ' را کامل ما در ' + CONFIG.brand + ' برایتان انجام می‌دهیم؛ بدون سردرگمی و معطلی. ' + cta;
    return { text: out, chips: ['هزینه‌اش چقدر است؟', 'چه مدارکی لازم است؟', 'مدارک را چطور بفرستم؟'] };
  }

  // قیمت/زمان کلی خدمات
  if (isPrice && /(خدمات|ثبت ?نام|انجام|شما|کارتون|کارتان)/.test(text)) {
    return { text: 'هزینهٔ خدمات را ادمین بعد از بررسی مدارک شما اعلام می‌کند. ' + cta, chips: suggestions() };
  }

  // موضوع‌های دیگر: بهترین امتیاز
  var bestT = null, bs = 0;
  for (var i = 0; i < TOPICS.length; i++) { var sc = score(text, TOPICS[i].keywords); if (sc > bs) { bs = sc; bestT = TOPICS[i]; } }
  if (bestT && bs >= 3) return { text: fill(bestT.answer), chips: suggestions() };

  // درخواست لینک/روش انجام کاری که در فهرست نیست: همان سیاست — ما انجام می‌دهیم
  if (SELF.test(text)) {
    return { text: 'برای کارهای اینترنتی و ثبت‌نام‌ها لینک یا آموزش نمی‌دهیم؛ ما در ' + CONFIG.brand + ' برایتان انجام می‌دهیم (فهرست کامل در «کلیه خدمات» صفحهٔ اصلی است). ' + cta, chips: suggestions() };
  }

  // خارج از موضوع
  return { text: 'من فقط دربارهٔ خدمات ' + CONFIG.brand + ' و استفاده از این برنامه جواب می‌دهم. اگر جواب سؤالتان را نگرفتید، از منوی ☰ گزینهٔ «' + CONFIG.support + '» را بزنید تا ادمین جواب بدهد. یا از این موضوع‌ها بپرسید:', chips: suggestions() };
}
function pick(id) {
  for (var i = 0; i < TOPICS.length; i++) if (TOPICS[i].id === id) return { text: fill(TOPICS[i].answer), chips: suggestions() };
  return { text: '', chips: [] };
}
function suggestions() { return START_CHIPS.slice(); }
var PRIV_NOTE = 'ℹ️ اشکالی ندارد که اطلاعاتتان را اینجا بنویسید، ولی بدانید پیام‌های این گفتگو فقط روی همین گوشی می‌مانند و برای ادمین فرستاده نمی‌شوند. برای انجام کار، مشخصات و مدارکتان را از بخش «' + CONFIG.docs + '» صفحهٔ اصلی بفرستید.';
function reply(raw) {
  var flat = String(raw || '').replace(/[\s\-‌]/g, '').replace(/[۰-۹]/g, function (d) { return String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); });
  var hasDigits = /\d{9,}/.test(flat);
  var r = replyCore(raw);
  if (hasDigits && !r.tool && !r.promise) {
    var onlyDigits = !/[آ-یa-zA-Z]/.test(String(raw).replace(/[۰-۹0-9٠-٩\s\-]/g, '')) ;
    r.text = onlyDigits ? PRIV_NOTE : r.text + '\n\n' + PRIV_NOTE;
  }
  return r;
}

window.AsnBot = { reply: reply, norm: norm, ctx: ctx };

var log = document.getElementById('log'), t = document.getElementById('t'), s = document.getElementById('s'), f = document.getElementById('f'), chipsBox = document.getElementById('chips');
var MEM_KEY = 'asannet_assistant_v1', MEM_MAX = 200, mem = { msgs: [], name: '', svc: '' };
function memLoad() { try { var j = JSON.parse(localStorage.getItem(MEM_KEY) || 'null'); if (j && j.msgs instanceof Array) mem = j; } catch (e) {} }
function memSave() { try { localStorage.setItem(MEM_KEY, JSON.stringify(mem)); } catch (e) {} }
function remember(role, text) {
  mem.msgs.push({ r: role, t: String(text) });
  if (mem.msgs.length > MEM_MAX) mem.msgs.splice(0, mem.msgs.length - MEM_MAX);
  mem.name = xs.name || ''; mem.svc = ctx.service ? ctx.service.name : '';
  memSave();
}
function add(role, text, noSave) {
  var r = document.createElement('div'); r.className = 'row ' + role;
  var b = document.createElement('div'); b.className = 'bubble'; b.textContent = text;
  r.appendChild(b); log.appendChild(r); log.scrollTop = log.scrollHeight;
  if (!noSave) remember(role, text);
  return r;
}
function welcome() {
  add('bot', 'سلام' + (xs.name ? ' ' + xs.name + ' جان' : '') + '! من «آسان‌نت» هستم، دستیار ' + CONFIG.brand + '. دربارهٔ خدمات و برنامه بپرسید، یا فقط گپ بزنیم 😊 (برای دیدن کارهایی که بلدم بنویسید «چه کارهایی بلدی؟»)');
}
function clearAll() {
  mem = { msgs: [], name: '', svc: '' }; memSave();
  xs.name = ''; xs.game = null; xs.pending = null; ctx.service = null;
  log.textContent = ''; welcome(); setChips(suggestions());
}
function setChips(list) {
  chipsBox.textContent = '';
  list.forEach(function (q) { var b = document.createElement('button'); b.type = 'button'; b.textContent = q; b.onclick = function () { send(q); }; chipsBox.appendChild(b); });
}
function send(text) {
  text = (text || '').trim(); if (!text) return;
  if (/^(پاک کردن گفتگو|گفتگو را پاک کن|گفتگو رو پاک کن|پاک کردن حافظه|حافظه رو پاک کن|حافظه را پاک کن|پاک کردن تاریخچه|فراموش کن|همه چیز رو فراموش کن)$/.test(norm(text))) { t.value = ''; clearAll(); add('bot', 'گفتگو و حافظه پاک شد 🧹 از اول شروع می‌کنیم.'); return; }
  add('user', text); t.value = ''; t.style.height = 'auto';
  var dots = document.createElement('div'); dots.className = 'row bot';
  dots.innerHTML = '<div class="bubble dots"><span></span><span></span><span></span></div>';
  log.appendChild(dots); log.scrollTop = log.scrollHeight;
  var r = reply(text);
  if (r.promise) {
    r.promise.then(function (x) { return x; }, function () { return { text: 'مشکلی پیش آمد، دوباره امتحان کنید.' }; }).then(function (x) {
      dots.remove(); add('bot', x.text); setChips(x.chips || []);
    });
    return;
  }
  setTimeout(function () { dots.remove(); add('bot', r.text); setChips(r.chips || []); }, 350);
}
f.addEventListener('submit', function (e) { e.preventDefault(); send(t.value); });
t.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); send(t.value); } });
t.addEventListener('input', function () { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; });
document.getElementById('clr').onclick = function () { clearAll(); add('bot', 'گفتگو و حافظه پاک شد 🧹 از اول شروع می‌کنیم.'); };
memLoad();
if (mem.msgs.length) {
  xs.name = mem.name || '';
  if (mem.svc) for (var mi = 0; mi < SERVICES.length; mi++) if (SERVICES[mi].name === mem.svc) ctx.service = SERVICES[mi];
  mem.msgs.slice(-60).forEach(function (m) { add(m.r === 'user' ? 'user' : 'bot', m.t, true); });
  var nt = document.createElement('div'); nt.className = 'note'; nt.textContent = '— ادامهٔ گفتگوی قبلی —'; log.appendChild(nt);
  add('bot', 'خوش برگشتید' + (xs.name ? ' ' + xs.name + ' جان' : '') + '! 🌹 ادامه می‌دهیم؟ هر سؤالی دارید بپرسید.', true);
} else { welcome(); }
setChips(suggestions());
</script>
</body>
