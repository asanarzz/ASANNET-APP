*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  font-family:Vazirmatn,Tahoma,"Segoe UI",Arial,sans-serif;color:#fff;overflow:hidden;position:relative;
  background:radial-gradient(ellipse at 50% 35%,#13824b 0%,#0a4d2b 58%,#052a18 100%);
  user-select:none;-webkit-user-select:none;
}
/* لوگوی کم‌رنگ پس‌زمینه */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:var(--logo) center 50%/min(82vw,540px) no-repeat;opacity:.13;
}
#app{position:relative;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;background:rgba(0,0,0,.32);border-bottom:2px solid rgba(255,194,75,.55)}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.lg{width:38px;height:38px;flex:none;border-radius:10px;background:#fff var(--logo) center/84% no-repeat;box-shadow:0 0 0 2px var(--orange)}
.name{font-weight:800;font-size:16px;color:var(--gold);white-space:nowrap;line-height:1.2}
.sub{font-size:11px;opacity:.8;white-space:nowrap}
.stats{display:flex;gap:12px}
.stats div{text-align:center;line-height:1.15}
.stats small{display:block;font-size:10px;opacity:.75}
.stats b{font-size:15px;font-variant-numeric:tabular-nums}
#board{flex:1;min-height:0;position:relative;direction:ltr;overflow-y:auto;overflow-x:hidden}
#top{position:relative}
.trow{display:flex;justify-content:space-between;align-items:flex-start;padding-top:6px}
.trow.left{flex-direction:row-reverse}
#found{display:flex;gap:2px}
.mini{border-radius:4px;border:1px dashed rgba(255,255,255,.3);background:rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;font-weight:800}
.mini.full{background:#fff;border:1px solid #8a9;box-shadow:0 1px 2px rgba(0,0,0,.4)}
#stock{position:relative;cursor:pointer;border-radius:6px}
#stock.empty{border:1.5px dashed rgba(255,255,255,.3)}
#tab{position:relative}
.slot{position:absolute;border-radius:calc(var(--cw)*.1);border:1.5px dashed rgba(255,255,255,.28);background:rgba(0,0,0,.12)}
.card{position:absolute;border-radius:calc(var(--cw)*.1);touch-action:none;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.card.up{background:linear-gradient(#fff,#f0efe8);border:1px solid #9aa59d;font-weight:800;color:#111827}
.card.down{background:#fff var(--logo) center/80% no-repeat;border:1px solid #1d4f8c;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 3.5px var(--orange),0 1px 2px rgba(0,0,0,.5)}
.card .tp{display:flex;align-items:center;gap:0;padding:1px 0 0 2px;font-size:calc(var(--cw)*.44);line-height:1.05;white-space:nowrap;letter-spacing:-.5px}.card .tp span{font-size:.82em}
.card .big{position:absolute;right:0;bottom:4%;left:0;text-align:center;font-size:calc(var(--cw)*.78);line-height:1;opacity:.92}
.card.up.cS,.card.up.cC{color:#111827}.card.up.cH,.card.up.cD{color:#d62828}.mini.full.cS,.mini.full.cC{color:#111827}.mini.full.cH,.mini.full.cD{color:#d62828}
.card.drag{z-index:999!important;box-shadow:0 8px 18px rgba(0,0,0,.55)}
.card.hint,.slot.hint2,.card.hint2{outline:3px solid var(--gold);outline-offset:-2px;animation:pulse .8s ease-in-out infinite alternate}
.card.hint2,.slot.hint2{outline-color:#7dd3fc}
#stock.hint{outline:3px solid var(--gold);animation:pulse .8s ease-in-out infinite alternate}
@keyframes pulse{to{filter:brightness(1.18)}}
.card.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#bar{display:flex;gap:6px;padding:6px 8px;background:rgba(0,0,0,.38);border-top:2px solid rgba(255,194,75,.45)}
#bar button{flex:1;border:0;border-radius:10px;padding:8px 2px;font:inherit;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(#f9a03f,#d9690f);box-shadow:0 2px 0 #8a4308;cursor:pointer;line-height:1.25}
#bar button:active{transform:translateY(1px);box-shadow:0 1px 0 #8a4308}
#bar button span{display:block;font-size:17px}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.82);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;max-width:92vw;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
#ov.show{display:flex}
.dlg{width:min(100%,380px);max-height:92dvh;overflow:auto;background:#0b6b38;border:2px solid var(--gold);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.dlg h2{margin:0;padding:12px 16px;font-size:18px;text-align:center;background:linear-gradient(#1b2b24,#0e1a15);color:var(--gold);border-radius:14px 14px 0 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.14);font-size:15px}
.row small{display:block;font-size:11px;opacity:.75;margin-top:2px}
.tg{flex:none;width:62px;height:30px;border-radius:15px;background:rgba(0,0,0,.35);position:relative;cursor:pointer;transition:.2s}
.tg::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--orange)}
.tg.on::after{right:35px}
.seg{display:flex;gap:4px;flex:none}
.seg button{width:38px;height:34px;border:0;border-radius:8px;font:inherit;font-weight:800;font-size:16px;color:#fff;background:rgba(0,0,0,.35);cursor:pointer}
.seg button.on{background:linear-gradient(#3fcf3f,#1c8a1c);box-shadow:0 0 0 2px #fff}
.btns{display:flex;gap:8px;padding:12px 16px}
.btns button{flex:1;border:0;border-radius:10px;padding:10px;font:inherit;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(#f9a03f,#d9690f);cursor:pointer}
.btns button.alt{background:rgba(0,0,0,.4)}
.msg{padding:16px;text-align:center;line-height:1.9;font-size:15px}
.win .lg{width:70px;height:70px;margin:14px auto 0;display:block}
.kv{display:flex;justify-content:space-between;padding:9px 18px;border-bottom:1px solid rgba(255,255,255,.14)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- پوسته‌ی هلویی مثل بازی مرجع ---------- */
body{background:#f4977a;color:#3a2a30}
body::before{opacity:.1}
.scr{position:fixed;inset:0;display:none;flex-direction:column;z-index:10}
#game{background:#f4977a;inset:auto;left:0;right:0;top:0;height:100vh;height:100dvh;overflow:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#game::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.12) 0 60px,transparent 62px),radial-gradient(circle at 85% 70%,rgba(255,255,255,.1) 0 90px,transparent 92px);pointer-events:none}

.pc.out svg,.pc.out .pn{opacity:0;transform:scale(.8)}
.pc svg,.pc .pn{transition:opacity .22s,transform .22s}
.pc.sel{background:#e6f9d8;outline:5px solid #4aa04a;outline-offset:-5px}
.pc.mine::after{content:"تو";position:absolute;top:3px;right:3px;background:#4aa04a;color:#fff;font-size:10px;font-weight:800;border-radius:8px;padding:1px 6px}

];
var EYE={blue:'#4a90d9',green:'#4f9a4a',brown:'#8a4b22',black:'#1b1b1f'};

function shade(hex,f){
  var n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return 'rgb('+Math.round(r*f)+','+Math.round(g*f)+','+Math.round(b*f)+')';
}
/* رسم چهره به‌صورت SVG */
var avCache={};

  if(avCache[i])return avCache[i];
  var c=CH[i],sk=c.skc,skd=shade(sk,.86),hc=c.hcc,brow=c.hs==='bald'?'#3b2a24':hc,s='';

  [40,60].forEach(function(x){

    s+='<circle cx="'+x+'" cy="44" r="3.5" fill="'+EYE[c.eye]+'"/><circle cx="'+x+'" cy="44" r="1.7" fill="#14141a"/><circle cx="'+(x+1.2)+'" cy="42.6" r="1" fill="#fff"/>';
  });

  s+='<path d="M53.5 37.5 Q60 34 66.5 37" stroke="'+brow+'" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
  s+='<path d="M50 47 Q47.5 52 51 52.6" stroke="'+skd+'" stroke-width="1.9" fill="none" stroke-linecap="round"/>';
  /* ریش و سبیل */
  var fc=c.fhc||hc;
  if(c.fh==='beard')s+='<path d="M28 50 Q27 76 50 78 Q73 76 72 50 Q66 67 50 66 Q34 67 28 50 Z" fill="'+fc+'"/>';
  if(c.fh==='beard'||c.fh==='mustache')s+='<path d="M39.5 58 Q45 53 50 57 Q55 53 60.5 58 Q55 63 50 60.5 Q45 63 39.5 58 Z" fill="'+fc+'"/>';
  var my=(c.fh==='beard'||c.fh==='mustache')?65:59;

    else s+='<circle cx="27.5" cy="56.5" r="2.7" fill="'+c.jw+'"/><circle cx="72.5" cy="56.5" r="2.7" fill="'+c.jw+'"/>';
  }
  if(c.acc.indexOf('necklace')>=0){
    s+='<path d="M38 78 Q50 91 62 78" stroke="'+c.jw+'" stroke-width="1.8" fill="none"/>';
    for(var t=0;t<=4;t++){
      var u=t/4,bx=38+24*u,by=78+13*4*u*(1-u)*(1-0.0);
      s+='<circle cx="'+bx.toFixed(1)+'" cy="'+(78+6.5*Math.sin(Math.PI*u)*2).toFixed(1)+'" r="2.2" fill="'+c.jw+'"/>';

/* ---------- پرسش‌ها ---------- */
var CATS=[
 {id:'g',label:'جنسیت',short:'جنسیت',icon:'🚻',opts:[['M','مرد','🧔'],['F','زن','👩']]},
 {id:'eye',label:'رنگ چشم',short:'چشم',icon:'👁️',opts:[['blue','آبی','#4a90d9'],['green','سبز','#4f9a4a'],['brown','قهوه‌ای','#8a4b22'],['black','مشکی','#1b1b1f']]},
 {id:'hs',label:'مدل مو',short:'مدل مو',icon:'💇',opts:[['bald','کچل','🥚'],['short','کوتاه','✂️'],['bob','تا گردن','💁'],['long','بلند','🧜'],['curly','فر','🌀']]},
 {id:'hc',label:'رنگ مو',short:'رنگ مو',icon:'🎨',opts:[['black','مشکی','#1b1b1f'],['brown','قهوه‌ای','#6b3a22'],['blonde','بلوند','#ffc734'],['red','حنایی','#d9561e'],['gray','خاکستری','#c9c7e0']]},
 {id:'sk',label:'رنگ پوست',short:'پوست',icon:'🖐️',opts:[['light','روشن','#fbd7c7'],['medium','گندمی','#f0a860'],['dark','تیره','#7a4331']]},
 {id:'acc',label:'متعلقات',short:'متعلقات',icon:'👓',opts:[['glasses','عینک','👓'],['hat','کلاه','🎩'],['earrings','گوشواره','💎'],['necklace','گردنبند','📿']]},
 {id:'fh',label:'ریش و سبیل',short:'ریش/سبیل',icon:'🧔',opts:[['beard','ریش','🧔'],['mustache','فقط سبیل','🥸'],['none','بدون ریش و سبیل','🙂']]}
];
function catOf(id){return CATS.filter(function(c){return c.id===id})[0]}
function labelOf(cat,val){var o=catOf(cat).opts.filter(function(x){return x[0]===val})[0];return o?o[1]:val}
function match(ch,cat,val){
  switch(cat){
    case 'g':return ch.g===val;
    case 'eye':return ch.eye===val;
    case 'hs':return ch.hs===val;
    case 'hc':return ch.hc===val;
    case 'sk':return ch.sk===val;
    case 'acc':return ch.acc.indexOf(val)>=0;
    case 'fh':return (ch.fh||'none')===val;
  }
  return false;
}
function qText(cat,val,subj){
  subj=subj||'این شخص';
  var l=labelOf(cat,val);
  switch(cat){
    case 'g':return 'آیا '+subj+' '+(val==='M'?'مرد':'زن')+' است؟';
    case 'eye':return 'آیا چشم‌های '+subj+' '+l+' است؟';
    case 'hs':return val==='bald'?'آیا '+subj+' کچل است؟':'آیا مدل موی '+subj+' '+l+' است؟';
    case 'hc':return 'آیا رنگ موی '+subj+' '+l+' است؟';
    case 'sk':return 'آیا رنگ پوست '+subj+' '+l+' است؟';
    case 'acc':return 'آیا '+subj+' '+l+' دارد؟';
    case 'fh':return val==='beard'?'آیا '+subj+' ریش دارد؟':(val==='mustache'?'آیا '+subj+' فقط سبیل دارد؟':'آیا '+subj+' ریش و سبیل ندارد؟');
  }
}
function allQs(){var o=[];CATS.forEach(function(c){c.opts.forEach(function(p){o.push({cat:c.id,val:p[0]})})});return o}

/* ---------- وضعیت بازی ---------- */
var G=null;
function mkp(){return {secret:-1,out:new Array(30).fill(false),undo:[]}}
function newGame(mode){
  G={mode:mode,players:[mkp(),mkp()],turn:0,phase:'pick',pickFor:0,sel:-1,q:null,guess:false,asked:{},over:false,log:[],lastBot:null};
  if(mode==='bot')G.players[1].secret=Math.floor(Math.random()*30);
  home.style.display='none';game.style.display='flex';
  if(mode==='friend'){handoff('بازیکن ۱: شخصیتت را انتخاب کن.\nبازیکن ۲ نگاه نکند!',function(){render()})}
  else render();
}
function viewer(){return G.mode==='bot'?0:(G.phase==='pick'?G.pickFor:G.turn)}
function pname(p){return G.mode==='bot'?(p===0?'تو':'ربات'):('بازیکن '+fa(p+1))}

/* ---------- رسم ---------- */
function layout(){
  var W=game.clientWidth||window.innerWidth,Hh=game.clientHeight||window.innerHeight;
  var brand=document.querySelector('.gbrand'),brandH=brand?brand.offsetHeight:42;
  var bottomBudget=172,gap=5,pad=7,ratio=1.06;
  var avail=Hh-brandH-bottomBudget-10;
  var cardH=(avail-pad*2-gap*5)/6,cardW=cardH/ratio;
  var maxW=(W-8-pad*2-gap*4)/5;
  if(cardW>maxW)cardW=maxW;
  cardW=Math.floor(Math.max(40,cardW));var ch=Math.floor(cardW*ratio);
  grid.style.gridTemplateColumns='repeat(5,'+cardW+'px)';
  grid.style.setProperty('--fs',Math.max(9,Math.round(cardW*.2))+'px');
  return {cw:cardW,ch:ch};
}
function render(){
  if(!G)return;
  var v=viewer(),P=G.players[v],sz=layout(),h='';
  for(var i=0;i<30;i++){
    var cls='pc'+(P.out[i]?' out':'')+((G.phase==='pick'&&G.sel===i)?' sel':'')+((G.phase!=='pick'&&P.secret===i)?' mine':'')+((G.guess&&!P.out[i])?' gs':'');
    h+='<div class="'+cls+'" data-i="'+i+'" style="width:'+sz.cw+'px;height:'+sz.ch+'px">'+avatar(i)+'<div class="pn">'+CH[i].n+'</div></div>';
  }
  grid.innerHTML=h;
  $('tl').textContent=G.phase==='pick'?'انتخاب شخصیت':(G.mode==='bot'?(G.phase==='bot'?'نوبت ربات':'نوبت تو'):('نوبت '+pname(G.turn)));
  renderBottom();
}
function renderBottom(){
  var b=$('gbottom'),h='';
  if(G.phase==='pick'){
    h='<div class="big">'+(G.mode==='bot'?'شخصیتت را انتخاب کن!':pname(G.pickFor)+': شخصیتت را انتخاب کن!')+'</div>';
    if(G.sel>=0)h+='<button class="gb green" id="cf">تأیید</button>';
  }else if(G.phase==='ask'&&!G.guess){
    if(G.mode==='bot'&&G.lastBot)h+='<div class="qpanel mini"><div class="qt">آخرین سؤال ربات: '+G.lastBot.text+' — <b style="color:'+(G.lastBot.ans?'#3aa04a':'#e0525a')+'">'+(G.lastBot.ans?'بله':'نه')+'</b></div></div>';
    h+='<div class="catbar">';
    CATS.forEach(function(c){h+='<button class="cat" data-c="'+c.id+'"><span>'+c.icon+'</span>'+c.short+'</button>'});
    h+='</div><div class="row2"><button class="gb dark" id="gu">🎯 حدس نهایی</button><button class="gb" id="lg">📜 سؤال‌ها</button></div>';
  }else if(G.phase==='answered'&&!G.guess){
    h=qPanel(G.q)+'<div class="help">روی کارت‌هایی که با جواب نمی‌خوانند بزن تا کنار بروند</div>'+
      '<div class="row2"><button class="rb" id="ud" '+(G.players[viewer()].undo.length?'':'disabled')+'>↶</button><button class="gb" id="ps">نوبت بعدی</button><button class="gb dark" id="gu">🎯 حدس</button><button class="rb" id="lg">📜</button></div>';
    if(set.auto)h+='';
  }else if(G.phase==='bot'){
    h=(G.q?qPanel(G.q):'')+'<div class="help">'+(G.botMsg||'ربات در حال فکر کردن…')+'</div>';
  }else if(G.phase==='botq'){
    h=qPanel(G.q)+'<div class="help">ربات با این جواب کارت‌هایش را کنار گذاشت</div><button class="gb green" id="bc">ادامه</button>';
  }
  if(G.guess){
    h='<div class="big" style="font-size:19px">یک کارت را برای حدس نهایی انتخاب کن</div><button class="gb dark" id="gc">انصراف</button>';
  }
  b.innerHTML=h;
}
function openLog(){
  var h='<h2>سؤال‌ها و جواب‌ها</h2><div style="max-height:55vh;overflow:auto;padding:8px 16px 4px;text-align:right">';
  if(!G.log.length)h+='<div class="msg">هنوز سؤالی پرسیده نشده.</div>';
  G.log.slice().reverse().forEach(function(l){
    h+='<div class="kv" style="padding:8px 0;gap:10px"><span style="font-size:13px"><b>'+l.who+':</b> '+l.text+'</span><b style="color:'+(l.ans?'#3aa04a':'#e0525a')+'">'+(l.ans?'بله':'نه')+'</b></div>';
  });
  h+='</div><div class="btns"><button id="cl">بستن</button></div>';
  var d=modal(h);d.querySelector('#cl').onclick=clearModal;
}
function qPanel(q){
  if(!q)return '';
  return '<div class="qpanel"><div class="qt">'+q.text+'</div><div class="ans '+(q.ans?'y':'n')+'"><i>'+(q.ans?'✅':'❌')+'</i><b>'+(q.ans?'بله!':'نه!')+'</b></div></div>';
}

/* ---------- لمس‌ها ---------- */
grid.addEventListener('click',function(e){
  var el=e.target.closest('.pc');if(!el||!G||G.over)return;
  var i=+el.dataset.i,v=viewer(),P=G.players[v];
  if(G.phase==='pick'){G.sel=i;snd('pop');render();return}
  if(G.guess){
    if(P.out[i]){return}
    confirmGuess(i);return;
  }
  if(G.phase==='ask'||G.phase==='answered'){
    if(G.mode==='bot'&&G.turn!==0)return;
    P.out[i]=!P.out[i];P.undo.push(i);snd('flip');render();
  }
});
$('gbottom').addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.id==='cf')confirmPick();
  else if(t.dataset.c)openOpts(t.dataset.c);
  else if(t.id==='gu'){G.guess=true;snd('tap');render()}
  else if(t.id==='gc'){G.guess=false;snd('tap');render()}
  else if(t.id==='ud'){var P=G.players[viewer()],i=P.undo.pop();if(i!==undefined){P.out[i]=!P.out[i];snd('flip');render()}}
  else if(t.id==='ps')passTurn();
  else if(t.id==='lg')openLog();
  else if(t.id==='bc'){G.phase='ask';G.turn=0;G.q=null;snd('tap');render()}
});
document.addEventListener('contextmenu',function(e){e.preventDefault()});

function confirmPick(){
  var p=G.pickFor;
  G.players[p].secret=G.sel;G.sel=-1;snd('yes');
  if(G.mode==='bot'){G.phase='ask';G.turn=0;render();return}
  if(p===0){
    G.pickFor=1;
    handoff('گوشی را به بازیکن ۲ بده.\nبازیکن ۲: شخصیتت را انتخاب کن.',function(){render()});
    G.phase='pick';
  }else{
    G.phase='ask';G.turn=0;
    handoff('گوشی را به بازیکن ۱ بده.\nنوبت بازیکن ۱ است!',function(){render()});
  }
}
function handoff(text,cb){
  var hd=$('hand');$('handt').innerHTML=text.split('\n').join('<br>');
  hd.style.display='flex';
  $('handb').onclick=function(){hd.style.display='none';snd('tap');cb&&cb()};
}
function openOpts(catId){
  var c=catOf(catId),h='<h2>'+c.label+'</h2><button class="xbtn" id="xx">✕</button><div class="opts">';
  c.opts.forEach(function(o){
    var vis=o[2].charAt(0)==='#'?'<span class="sw" style="background:'+o[2]+'"></span>':'<i>'+o[2]+'</i>';
    h+='<button class="opt" data-v="'+o[0]+'">'+vis+o[1]+'</button>';
  });
  h+='</div>';
  var d=modal(h);
  d.querySelector('#xx').onclick=clearModal;
  [].forEach.call(d.querySelectorAll('.opt'),function(b){b.onclick=function(){clearModal();ask(catId,b.dataset.v)}});
}
function ask(cat,val){
  var opp=G.players[1-G.turn].secret,ans=match(CH[opp],cat,val);
  G.q={cat:cat,val:val,text:qText(cat,val),ans:ans};
  G.log.push({who:pname(G.turn),text:G.q.text,ans:ans});
  G.phase='answered';snd(ans?'yes':'no');render();
  if(set.auto){
    var P=G.players[G.turn];
    for(var i=0;i<30;i++)if(!P.out[i]&&match(CH[i],cat,val)!==ans){P.out[i]=true;P.undo.push(i)}
    render();
  }
}
function passTurn(){
  snd('pass');G.q=null;
  if(G.mode==='bot'){botTurn();return}
  G.turn=1-G.turn;G.phase='ask';
  handoff('گوشی را به '+pname(G.turn)+' بده.<br>نوبت '+pname(G.turn)+' است!',function(){render()});
  grid.innerHTML='';$('gbottom').innerHTML='';
}

/* ---------- هوش ربات ---------- */
function botCands(){var o=[],P=G.players[1];for(var i=0;i<30;i++)if(!P.out[i])o.push(i);return o}
function botTurn(){
  G.phase='bot';G.turn=1;G.botMsg='ربات در حال فکر کردن…';render();
  setTimeout(function(){
    var cands=botCands(),d=set.diff,P=G.players[1];
    var doGuess=false;
    if(cands.length===1)doGuess=true;
    else if(cands.length===2&&d>=1&&Math.random()<(d===2?.5:.35))doGuess=true;
    else if(cands.length<=3&&d===0&&Math.random()<.2)doGuess=true;
    if(doGuess){
      var gi=cands[Math.floor(Math.random()*cands.length)];
      G.botMsg='ربات حدس می‌زند: «'+CH[gi].n+'»…';render();
      setTimeout(function(){endGame(1,gi===G.players[0].secret,gi)},1500);
      return;
    }
    var qs=allQs().filter(function(q){return !G.asked[q.cat+q.val]});
    var sc=qs.map(function(q){
      var y=0;cands.forEach(function(i){if(match(CH[i],q.cat,q.val))y++});
      return {q:q,y:y,s:Math.abs(y-cands.length/2),useful:y>0&&y<cands.length};
    });
    var useful=sc.filter(function(x){return x.useful});
    var pool=useful.length?useful:sc;
    pool.sort(function(a,b){return a.s-b.s});
    var pick;
    if(d===2)pick=pool[0];
    else if(d===1)pick=pool[Math.floor(Math.random()*Math.min(5,pool.length))];
    else pick=Math.random()<.5?pool[Math.floor(Math.random()*pool.length)]:pool[Math.floor(Math.random()*Math.min(8,pool.length))];
    var q=pick.q,ans=match(CH[G.players[0].secret],q.cat,q.val);
    G.asked[q.cat+q.val]=true;
    G.q={cat:q.cat,val:q.val,text:'ربات می‌پرسد: '+qText(q.cat,q.val,'شخصیت تو'),ans:ans};
    G.botMsg='ربات کارت‌هایش را کنار می‌گذارد…';
    snd(ans?'yes':'no');render();
    cands.forEach(function(i){if(match(CH[i],q.cat,q.val)!==ans)P.out[i]=true});
    G.lastBot={text:qText(q.cat,q.val,'شخصیت تو'),ans:ans};
    G.log.push({who:'ربات',text:G.lastBot.text,ans:ans});
    setTimeout(function(){G.phase='botq';G.turn=0;G.botMsg=null;render()},900);
  },900);
}

/* ---------- حدس نهایی و پایان ---------- */
function confirmGuess(i){
  var d=modal('<h2>حدس نهایی</h2><div class="reveal"><div class="pc" style="--fs:14px">'+avatar(i)+'<div class="pn">'+CH[i].n+'</div></div></div><div class="msg">مطمئنی که شخصیت «'+CH[i].n+'» است؟</div>'+
    '<div class="btns"><button id="y">بله، مطمئنم</button><button id="n" class="alt">نه</button></div>');
  d.querySelector('#y').onclick=function(){clearModal();G.guess=false;endGame(G.turn,i===G.players[1-G.turn].secret,i)};
  d.querySelector('#n').onclick=function(){clearModal()};
}
function endGame(by,correct,gi){
  G.over=true;
  var winner=correct?by:1-by;
  var oppSecret=G.players[1-by].secret,mySecret=G.players[by].secret;
  var h,sound;
  if(G.mode==='bot'){
    var humanWon=winner===0;
    if(humanWon)stats.bw++;else stats.bl++;
    lsSet('asan_guess_stats',stats);
    var show=humanWon?G.players[1].secret:(by===1?G.players[0].secret:G.players[1].secret);
    var title=humanWon?'آفرین! بردی 🎉':'باختی 😅';
    var msg=by===0?(correct?'درست حدس زدی! شخصیت ربات «'+CH[G.players[1].secret].n+'» بود.':'حدست اشتباه بود؛ شخصیت ربات «'+CH[G.players[1].secret].n+'» بود.'):
                   (correct?'ربات شخصیتت «'+CH[G.players[0].secret].n+'» را درست حدس زد.':'ربات اشتباه حدس زد («'+CH[gi].n+'»)؛ شخصیت تو «'+CH[G.players[0].secret].n+'» بود.');
    h='<h2 style="color:'+(humanWon?'#3aa04a':'#e0525a')+'">'+title+'</h2><div class="reveal"><div class="pc" style="--fs:14px">'+avatar(show)+'<div class="pn">'+CH[show].n+'</div></div></div><div class="msg">'+msg+'</div>';
    sound=humanWon?'win':'lose';
  }else{
    stats.fr++;lsSet('asan_guess_stats',stats);
    var sh=G.players[1-by].secret;
    h='<h2 style="color:#3aa04a">'+pname(winner)+' برنده شد! 🎉</h2><div class="reveal"><div class="pc" style="--fs:14px">'+avatar(sh)+'<div class="pn">'+CH[sh].n+'</div></div></div><div class="msg">'+
       (correct?pname(by)+' شخصیت «'+CH[sh].n+'» را درست حدس زد.':pname(by)+' اشتباه حدس زد؛ شخصیت «'+CH[sh].n+'» بود.')+'</div>';
    sound='win';
  }
  h+='<div class="btns"><button id="ag">بازی دوباره</button><button id="mn" class="alt">منو</button></div>';
  var d=modal(h);snd(sound,.2);
  d.querySelector('#ag').onclick=function(){clearModal();newGame(G.mode)};
  d.querySelector('#mn').onclick=function(){clearModal();showHome()};
}

/* ---------- پنجره‌ها ---------- */
function toast(t){
  var el=$('toast');el.textContent=t;el.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show')},2300);
}
function modal(html){ov.innerHTML='<div class="dlg">'+html+'</div>';ov.className='show';return ov.firstChild}
function clearModal(){ov.className='';ov.innerHTML=''}
ov.addEventListener('click',function(e){if(e.target===ov)clearModal()});
function openHelp(){
  var d=modal('<h2>راهنمای بازی</h2><div class="msg" style="text-align:right">'+
    '۱. هر کدام از شما یک شخصیت مخفی انتخاب می‌کنید.<br>'+
    '۲. هر نوبت یک سؤال بله/خیر درباره‌ی شخصیتِ حریف می‌پرسی (مثلاً «آیا عینک دارد؟»).<br>'+
    '۳. با جواب، روی کارت‌ها بزن تا کسانی که نمی‌خوانند کنار بروند.<br>'+
    '۴. وقتی مطمئن شدی «حدس نهایی» را بزن. اگر درست باشد برنده‌ای، اگر نه می‌بازی!<br>۵. با دکمه‌ی «📜 سؤال‌ها» همه‌ی سؤال‌ها و جواب‌ها را دوباره می‌بینی.</div>'+
    '<div class="btns"><button id="cl">بستن</button></div>');
  d.querySelector('#cl').onclick=clearModal;
}
function openSettings(){
  function tg(k,on){return '<div class="tg'+(on?' on':'')+'" data-k="'+k+'"></div>'}
  var d=modal('<h2>تنظیمات</h2>'+
    '<div class="row"><div>صدا و افکت‌ها</div>'+tg('sound',set.sound)+'</div>'+
    '<div class="row"><div>حذف خودکار کارت‌ها<small>بعد از جواب، کارت‌هایی که نمی‌خوانند خودشان کنار می‌روند</small></div>'+tg('auto',set.auto)+'</div>'+
    '<div class="btns"><button id="cl">بستن</button></div>');
  [].forEach.call(d.querySelectorAll('.tg'),function(el){
    el.onclick=function(){var k=el.dataset.k;set[k]=!set[k];el.classList.toggle('on',set[k]);lsSet('asan_guess_set',set);if(k==='sound'&&set.sound)snd('tap')};
  });
  d.querySelector('#cl').onclick=clearModal;
}
function openStats(){
  var d=modal('<h2>آمار</h2>'+
    '<div class="kv"><span>برد مقابل ربات</span><b>'+fa(stats.bw)+'</b></div>'+
    '<div class="kv"><span>باخت مقابل ربات</span><b>'+fa(stats.bl)+'</b></div>'+
    '<div class="kv"><span>بازی با دوست</span><b>'+fa(stats.fr)+'</b></div>'+
    '<div class="btns"><button id="cl">بستن</button></div>');
  d.querySelector('#cl').onclick=clearModal;
}

/* ---------- صفحه‌ی شروع ---------- */
function updHome(){
  var d=DIFF[set.diff];
  home.style.setProperty('--dc',d.col);home.style.setProperty('--dc2',d.col2);
  home.style.setProperty('--p',(set.diff/2*100)+'%');
  $('dslider').value=set.diff;$('dname').textContent=d.n;
}
function showHome(){
  game.style.display='none';$('hand').style.display='none';home.style.display='flex';G=null;updHome();
}
$('dslider').addEventListener('input',function(){set.diff=+this.value;lsSet('asan_guess_set',set);updHome();snd('tap')});
$('pBot').onclick=function(){snd('pop');newGame('bot')};
$('pFr').onclick=function(){snd('pop');newGame('friend')};
$('hHelp').onclick=openHelp;$('hSet').onclick=openSettings;$('hStat').onclick=openStats;
$('exit').onclick=function(){
  var d=modal('<div class="msg">از بازی خارج می‌شوی؟</div><div class="btns"><button id="y">بله</button><button id="n" class="alt">نه</button></div>');
  d.querySelector('#y').onclick=function(){clearModal();showHome()};d.querySelector('#n').onclick=clearModal;
};
window.addEventListener('resize',function(){if(G&&game.style.display==='flex')render()});
showHome();
})();
</script>
