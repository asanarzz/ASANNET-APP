<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f6f8f7">
<title>۲۰۴۸ | آسان‌نت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --page:#f5f7f6;
  --surface:#ffffff;
  --surface-2:#f8faf9;
  --green:#159447;
  --green-dark:#0b7134;
  --green-soft:#dff4e6;
  --ink:#17211b;
  --muted:#7b887f;
  --line:#e4ebe6;
  --board:#198f45;
  --empty:#d8f0df;
  --shadow:0 18px 50px rgba(20,65,38,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:'Vazirmatn',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 50% -15%, #ffffff 0 28%, transparent 55%),
    var(--page);
  display:flex;
  justify-content:center;
  user-select:none;
  touch-action:none;
}
.app{
  width:min(100%,560px);
  height:100dvh;
  display:flex;
  flex-direction:column;
  padding:18px 16px 12px;
  gap:12px;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
}
.brand-icon{
  width:48px;height:48px;border-radius:15px;
  display:grid;place-items:center;
  color:#fff;font-size:22px;font-weight:900;
  background:linear-gradient(145deg,#20ae59,#0d7d39);
  box-shadow:0 8px 20px rgba(21,148,71,.24);
}
.brand-text small{display:block;color:var(--muted);font-size:11px;font-weight:700}
.brand-text strong{display:block;font-size:19px;font-weight:900;letter-spacing:-.5px}
.badge{
  background:var(--green-soft);color:var(--green-dark);
  border:1px solid #ccebd6;border-radius:999px;
  padding:7px 11px;font-size:11px;font-weight:800;
}
.title-row{
  display:flex;align-items:flex-end;justify-content:space-between;
  margin-top:2px;
}
h1{
  font-size:44px;line-height:.95;font-weight:900;
  letter-spacing:-2px;color:var(--green-dark);
}
.subtitle{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px}
.scores{
  display:grid;grid-template-columns:1fr 1fr auto;gap:9px;
}
.card{
  background:rgba(255,255,255,.92);
  border:1px solid var(--line);
  border-radius:16px;
  padding:9px 12px;
  box-shadow:0 7px 22px rgba(22,58,35,.05);
}
.card .label{font-size:10px;color:var(--muted);font-weight:800}
.card .value{
  font-size:21px;line-height:1.2;font-weight:900;color:var(--ink);
  margin-top:1px;
}
.new-game{
  border:0;border-radius:16px;padding:0 16px;
  min-height:58px;cursor:pointer;
  color:#fff;font-family:inherit;font-size:13px;font-weight:900;
  background:linear-gradient(145deg,#20aa55,#0b7d38);
  box-shadow:0 9px 22px rgba(21,148,71,.22);
  transition:.15s transform;
}
.new-game:active{transform:scale(.96)}
.game-card{
  position:relative;
  width:100%;aspect-ratio:1/1;
  background:var(--board);
  border-radius:26px;
  padding:12px;
  box-shadow:
    0 22px 45px rgba(17,91,43,.18),
    inset 0 1px 0 rgba(255,255,255,.18);
}
#board{
  width:100%;height:100%;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(4,1fr);
  gap:10px;
}
.cell{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  border-radius:15px;
  background:rgba(255,255,255,.19);
}
.cell .ad-fill{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.cell .ad-fill img{width:72%;height:72%;object-fit:contain}
.tile{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:15px;
  font-family:'Vazirmatn',sans-serif;
  font-size:34px;font-weight:900;
  animation:pop .13s cubic-bezier(.2,.9,.25,1.2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 5px 12px rgba(0,0,0,.10);
}
@keyframes pop{from{transform:scale(.65);opacity:.35}to{transform:scale(1);opacity:1}}
.t2{background:#fff;color:#344238}
.t4{background:#eff8f1;color:#263a2c}
.t8{background:#bfe8ca;color:#165b2c}
.t16{background:#8bd59f;color:#124d25}
.t32{background:#56c978;color:#fff}
.t64{background:#27ad55;color:#fff}
.t128{background:#168f43;color:#fff;font-size:.82em}
.t256{background:#0d7b38;color:#fff;font-size:.82em}
.t512{background:#09682f;color:#fff;font-size:.78em}
.t1024{background:#075327;color:#fff;font-size:.69em}
.t2048{
  background:linear-gradient(145deg,#f5c84c,#e39b19);
  color:#fff;font-size:.69em;
  box-shadow:0 0 26px rgba(245,190,54,.55),inset 0 1px 0 rgba(255,255,255,.35);
}
.thi{background:linear-gradient(145deg,#173d27,#102b1c);color:#fff;font-size:.64em}
.help{
  display:flex;align-items:center;justify-content:center;gap:7px;
  color:var(--muted);font-size:11px;font-weight:700;
  text-align:center;
}
.help span{
  display:inline-grid;place-items:center;width:23px;height:23px;border-radius:8px;
  background:#fff;border:1px solid var(--line);color:var(--green-dark);font-size:12px;
}
footer{
  margin-top:auto;text-align:center;color:#9aa59d;
  font-size:10px;font-weight:700;line-height:1.5;
}
footer b{color:var(--green-dark)}
#overlay{
  position:absolute;inset:12px;
  display:none;align-items:center;justify-content:center;flex-direction:column;
  gap:12px;text-align:center;z-index:10;
  border-radius:20px;
  background:rgba(8,43,22,.88);
  backdrop-filter:blur(8px);
}
#overlay.show{display:flex}
#overlay .msg{
  font-size:42px;font-weight:900;color:#fff;
  text-shadow:0 4px 18px rgba(0,0,0,.18);
}
#overlay .msg.win{color:#ffd65a}
#overlay .msg.lose{color:#ffb3b3}
#overlay .btn-row{display:flex;gap:8px}
#overlay button{
  border:0;border-radius:13px;padding:10px 15px;
  font-family:inherit;font-size:13px;font-weight:900;cursor:pointer;
  background:#fff;color:var(--green-dark);
}
#overlay .ghost-btn{background:rgba(255,255,255,.13);color:#fff;border:1px solid rgba(255,255,255,.22)}
@media (max-height:720px){
  .app{padding-top:10px;gap:8px}
  .brand-icon{width:40px;height:40px;border-radius:12px}
  .brand-text strong{font-size:16px}
  h1{font-size:36px}
  .game-card{padding:9px;border-radius:20px}
  #board{gap:8px}
  .cell,.tile{border-radius:11px}
  .scores .card{padding:7px 10px}
}
@media (max-width:380px){
  .app{padding-left:10px;padding-right:10px}
  h1{font-size:38px}
  .new-game{padding:0 11px}
  .game-card{padding:9px}
  #board{gap:7px}
}
</style>
</head>

<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">۲۰</div>
      <div class="brand-text">
        <small>بازی اختصاصی</small>
        <strong>آسان‌نت</strong>
      </div>
    </div>
    <div class="badge">نسخه موبایل</div>
  </div>

  <div class="title-row">
    <div>
      <h1>۲۰۴۸</h1>
      <div class="subtitle">عددها را ترکیب کن و به ۲۰۴۸ برس!</div>
    </div>
  </div>

  <div class="scores">
    <div class="card">
      <div class="label">امتیاز</div>
      <div class="value" id="scoreVal">۰</div>
    </div>
    <div class="card">
      <div class="label">بهترین امتیاز</div>
      <div class="value" id="bestVal">۰</div>
    </div>
    <button class="new-game" id="newGameBtn">بازی جدید</button>
  </div>

  <div class="game-card" id="boardWrap">
    <div id="board"></div>
    <div id="overlay">
      <div class="msg" id="overlayMsg">بردی!</div>
      <div class="btn-row">
        <button id="continueBtn">ادامه بازی</button>
        <button class="ghost-btn" id="restartBtn">شروع دوباره</button>
      </div>
    </div>
  </div>

  <div class="help">
    <span>↔</span>
    با کشیدن انگشت حرکت بده
    <span>⌨</span>
    یا از کیبورد استفاده کن
  </div>

  <footer>
    ساخته شده برای <b>کافی‌نت آسان‌نت</b> · <b>@ASANNETT</b>
  </footer>
</div>

let grid = [];
let score = 0;
let best = 0;
let wonShown = false;
let gameOver = false;

function toFaDigits(s){ return String(s).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }

try{ best = Number(localStorage.getItem('asannett_2048_best')) || 0; }catch(e){ best = 0; }

function emptyGrid(){
  return Array.from({length:SIZE}, ()=> Array(SIZE).fill(0));
}

function getEmptyCells(g){
  const cells = [];
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(g[r][c]===0) cells.push([r,c]);
  return cells;
}

function spawnTile(g){
  const empties = getEmptyCells(g);
  if(empties.length===0) return false;
  const [r,c] = empties[Math.floor(Math.random()*empties.length)];
  g[r][c] = Math.random() < 0.9 ? 2 : 4;
  return true;
}

function buildCells(){
  boardEl.innerHTML = '';
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r; cell.dataset.c = c;
      const ad = document.createElement('div');
      ad.className = 'ad-fill';
      const img = document.createElement('img');
      img.src = LOGO_DATA_URI;
      img.alt = '@ASANNETT';
      ad.appendChild(img);
      cell.appendChild(ad);
      boardEl.appendChild(cell);
    }
  }
}

function tileClass(v){
  if(v <= 2048) return 't' + v;
  return 'thi';
}

function render(){
  const cells = boardEl.querySelectorAll('.cell');
  cells.forEach(cell=>{
    const existing = cell.querySelector('.tile');
    if(existing) existing.remove();
    const r = Number(cell.dataset.r), c = Number(cell.dataset.c);
    const v = grid[r][c];
    const adFill = cell.querySelector('.ad-fill');
    if(v !== 0){
      adFill.style.display = 'none';
      const tile = document.createElement('div');
      tile.className = 'tile ' + tileClass(v);
      tile.textContent = toFaDigits(v);
      cell.appendChild(tile);
    } else {
      adFill.style.display = 'flex';
    }
  });
  scoreVal.textContent = toFaDigits(score);
  bestVal.textContent = toFaDigits(best);
}

function slideLine(line){
  let arr = line.filter(v => v !== 0);
  let gained = 0;
  for(let i=0;i<arr.length-1;i++){
    if(arr[i] === arr[i+1]){
      arr[i] *= 2;
      gained += arr[i];
      arr[i+1] = 0;
      i++;
    }
  }
  arr = arr.filter(v => v !== 0);
  while(arr.length < SIZE) arr.push(0);
  return { line: arr, gained };
}

function transpose(g){
  const t = emptyGrid();
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) t[c][r] = g[r][c];
  return t;
}

function cloneGrid(g){ return g.map(row => row.slice()); }
function gridsEqual(a,b){ return JSON.stringify(a) === JSON.stringify(b); }

function move(direction){
  if(gameOver) return;
  const before = cloneGrid(grid);
  let totalGain = 0;

  if(direction === 'left' || direction === 'right'){
    for(let r=0;r<SIZE;r++){
      let row = grid[r].slice();
      if(direction === 'right') row = row.reverse();
      const { line, gained } = slideLine(row);
      totalGain += gained;
      grid[r] = direction === 'right' ? line.reverse() : line;
    }
  } else {
    let t = transpose(grid);
    for(let r=0;r<SIZE;r++){
      let row = t[r].slice();
      if(direction === 'down') row = row.reverse();
      const { line, gained } = slideLine(row);
      totalGain += gained;
      t[r] = direction === 'down' ? line.reverse() : line;
    }
    grid = transpose(t);
  }

  if(!gridsEqual(before, grid)){
    score += totalGain;
    if(score > best){ best = score; try{ localStorage.setItem('asannett_2048_best', String(best)); }catch(e){} }
    spawnTile(grid);
    render();
    checkWinLose();
  }
}

function checkWinLose(){
  if(!wonShown){
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
      if(grid[r][c] >= 2048){
        wonShown = true;
        showOverlay('win');
        return;
      }
    }
  }
  const empties = getEmptyCells(grid);
  if(empties.length > 0) return;
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      const v = grid[r][c];
      if(c < SIZE-1 && grid[r][c+1] === v) return;
      if(r < SIZE-1 && grid[r+1][c] === v) return;
    }
  }
  gameOver = true;
  showOverlay('lose');
}

function showOverlay(kind){
  overlay.classList.add('show');
  if(kind === 'win'){
    overlayMsg.textContent = '🎉 بردی! به ۲۰۴۸ رسیدی';
    overlayMsg.className = 'msg win';
    continueBtn.style.display = 'inline-block';
  } else {
    overlayMsg.textContent = 'باختی! حرکتی نمونده';
    overlayMsg.className = 'msg lose';
    continueBtn.style.display = 'none';
  }
}
function hideOverlay(){ overlay.classList.remove('show'); }

function startGame(){
  grid = emptyGrid();
  score = 0;
  gameOver = false;
  wonShown = false;
  hideOverlay();
  buildCells();
  spawnTile(grid);
  spawnTile(grid);
  render();
}

// ---- controls ----
document.addEventListener('keydown', e=>{
  const map = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down' };
  if(map[e.key]){ e.preventDefault(); move(map[e.key]); }
});

let touchStartX=0, touchStartY=0;
boardEl.addEventListener('touchstart', e=>{
  const t = e.touches[0];
  touchStartX = t.clientX; touchStartY = t.clientY;
}, {passive:true});
boardEl.addEventListener('touchend', e=>{
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  if(Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
  if(Math.abs(dx) > Math.abs(dy)){
    move(dx > 0 ? 'right' : 'left');
  } else {
    move(dy > 0 ? 'down' : 'up');
  }
}, {passive:true});

newGameBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);
continueBtn.addEventListener('click', hideOverlay);

startGame();
