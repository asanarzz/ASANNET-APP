*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  font-family:Vazirmatn,Tahoma,"Segoe UI",Arial,sans-serif;color:#fff;overflow:hidden;position:relative;
  background:radial-gradient(ellipse at 50% 35%,#13824b 0%,#0a4d2b 58%,#052a18 100%);
  user-select:none;-webkit-user-select:none;
}
/* لوگوی کم‌رنگ پس‌زمینه */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:var(--logo) center 50%/min(82vw,540px) no-repeat;opacity:.13;
}
#app{position:relative;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;background:rgba(0,0,0,.32);border-bottom:2px solid rgba(255,194,75,.55)}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.lg{width:38px;height:38px;flex:none;border-radius:10px;background:#fff var(--logo) center/84% no-repeat;box-shadow:0 0 0 2px var(--orange)}
.name{font-weight:800;font-size:16px;color:var(--gold);white-space:nowrap;line-height:1.2}
.sub{font-size:11px;opacity:.8;white-space:nowrap}
.stats{display:flex;gap:12px}
.stats div{text-align:center;line-height:1.15}
.stats small{display:block;font-size:10px;opacity:.75}
.stats b{font-size:15px;font-variant-numeric:tabular-nums}
#board{flex:1;min-height:0;position:relative;direction:ltr;overflow-y:auto;overflow-x:hidden}
#top{position:relative}
.trow{display:flex;justify-content:space-between;align-items:flex-start;padding-top:6px}
.trow.left{flex-direction:row-reverse}
#found{display:flex;gap:2px}
.mini{border-radius:4px;border:1px dashed rgba(255,255,255,.3);background:rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;font-weight:800}
.mini.full{background:#fff;border:1px solid #8a9;box-shadow:0 1px 2px rgba(0,0,0,.4)}
#stock{position:relative;cursor:pointer;border-radius:6px}
#stock.empty{border:1.5px dashed rgba(255,255,255,.3)}
#tab{position:relative}
.slot{position:absolute;border-radius:calc(var(--cw)*.1);border:1.5px dashed rgba(255,255,255,.28);background:rgba(0,0,0,.12)}
.card{position:absolute;border-radius:calc(var(--cw)*.1);touch-action:none;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.card.up{background:linear-gradient(#fff,#f0efe8);border:1px solid #9aa59d;font-weight:800;color:#111827}
.card.down{background:#fff var(--logo) center/80% no-repeat;border:1px solid #1d4f8c;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 3.5px var(--orange),0 1px 2px rgba(0,0,0,.5)}
.card .tp{display:flex;align-items:center;gap:0;padding:1px 0 0 2px;font-size:calc(var(--cw)*.44);line-height:1.05;white-space:nowrap;letter-spacing:-.5px}.card .tp span{font-size:.82em}
.card .big{position:absolute;right:0;bottom:4%;left:0;text-align:center;font-size:calc(var(--cw)*.78);line-height:1;opacity:.92}
.card.up.cS,.card.up.cC{color:#111827}.card.up.cH,.card.up.cD{color:#d62828}.mini.full.cS,.mini.full.cC{color:#111827}.mini.full.cH,.mini.full.cD{color:#d62828}
.card.drag{z-index:999!important;box-shadow:0 8px 18px rgba(0,0,0,.55)}
.card.hint,.slot.hint2,.card.hint2{outline:3px solid var(--gold);outline-offset:-2px;animation:pulse .8s ease-in-out infinite alternate}
.card.hint2,.slot.hint2{outline-color:#7dd3fc}
#stock.hint{outline:3px solid var(--gold);animation:pulse .8s ease-in-out infinite alternate}
@keyframes pulse{to{filter:brightness(1.18)}}
.card.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#bar{display:flex;gap:6px;padding:6px 8px;background:rgba(0,0,0,.38);border-top:2px solid rgba(255,194,75,.45)}
#bar button{flex:1;border:0;border-radius:10px;padding:8px 2px;font:inherit;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(#f9a03f,#d9690f);box-shadow:0 2px 0 #8a4308;cursor:pointer;line-height:1.25}
#bar button:active{transform:translateY(1px);box-shadow:0 1px 0 #8a4308}
#bar button span{display:block;font-size:17px}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.82);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;max-width:92vw;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
#ov.show{display:flex}
.dlg{width:min(100%,380px);max-height:92dvh;overflow:auto;background:#0b6b38;border:2px solid var(--gold);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.dlg h2{margin:0;padding:12px 16px;font-size:18px;text-align:center;background:linear-gradient(#1b2b24,#0e1a15);color:var(--gold);border-radius:14px 14px 0 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.14);font-size:15px}
.row small{display:block;font-size:11px;opacity:.75;margin-top:2px}
.tg{flex:none;width:62px;height:30px;border-radius:15px;background:rgba(0,0,0,.35);position:relative;cursor:pointer;transition:.2s}
.tg::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--orange)}
.tg.on::after{right:35px}
.seg{display:flex;gap:4px;flex:none}
.seg button{width:38px;height:34px;border:0;border-radius:8px;font:inherit;font-weight:800;font-size:16px;color:#fff;background:rgba(0,0,0,.35);cursor:pointer}
.seg button.on{background:linear-gradient(#3fcf3f,#1c8a1c);box-shadow:0 0 0 2px #fff}
.btns{display:flex;gap:8px;padding:12px 16px}
.btns button{flex:1;border:0;border-radius:10px;padding:10px;font:inherit;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(#f9a03f,#d9690f);cursor:pointer}
.btns button.alt{background:rgba(0,0,0,.4)}
.msg{padding:16px;text-align:center;line-height:1.9;font-size:15px}
.win .lg{width:70px;height:70px;margin:14px auto 0;display:block}
.kv{display:flex;justify-content:space-between;padding:9px 18px;border-bottom:1px solid rgba(255,255,255,.14)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{background:#2c4a64;color:#fff}
body::before{opacity:.08}
.scr{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;display:none;flex-direction:column;z-index:10;overflow:hidden}
/* ---------- صفحه‌ی بازی ---------- */
#game{background:#f7977a;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.gbrand{flex:none;display:flex;align-items:center;gap:8px;padding:4px 10px;background:rgba(90,35,20,.25);position:relative;z-index:3}
.gbrand .lg{width:32px;height:32px}
.gbrand b{display:block;font-size:15px;color:#fff3c9;font-weight:800;line-height:1.2}
.gbrand small{display:block;font-size:11px;color:#ffe6df}
.gbrand .sp{flex:1}

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var ov=$('ov'),home=$('home'),game=$('game'),bd=$('bd');
var FAST=/[?&]fast/.test(location.search);
function T(ms){return FAST?Math.max(20,ms/12):ms}
function fa(n){return String(n).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]})}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var set=Object.assign({sound:true,dif:0},lsGet('asan_bg_set',{}));
var stats=Object.assign({bw:0,bl:0,fr:0},lsGet('asan_bg_stats',{}));
var DIFF=[{n:'آسان',col:'#2fb64a',col2:'#2a9640'},{n:'متوسط',col:'#fda50f',col2:'#cf8a07'},{n:'سخت',col:'#ff5f5a',col2:'#cc4a4a'}];
var toastT,G=null,botT=null,M={},D=null,FLY=null;

/* ---------- صدا ---------- */
/* ---------- صدای کارت (ساخته‌شده با WebAudio از نویز فیلترشده، بدون فایل جانبی) ---------- */
var AC=null,NB=null;
function ac(){
  if(!set.sound)return null;
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
  if(AC.state==='suspended'){try{AC.resume()}catch(e){}}
  return AC;
}
function nbuf(){
  if(!NB){var a=AC,len=a.sampleRate;NB=a.createBuffer(1,len,a.sampleRate);var d=NB.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1}
  return NB;
}
/* ضربه/لغزش نویزی: بازه‌ی فرکانس f0 تا f1، قدرت vol */
function nz(t,dur,f0,f1,q,vol,att){
  var a=AC,s=a.createBufferSource();s.buffer=nbuf();s.loop=true;
  var f=a.createBiquadFilter();f.type='bandpass';f.Q.value=q;
  f.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  var g=a.createGain();g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+(att||.002));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t,Math.random()*.5);s.stop(t+dur+.02);
}
function tone(t0,freq,dur,vol,type,to){
  var a=AC,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t0);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+dur+.05);
}

function snd(k,delay){
  var c=ac();if(!c)return;
  var t=c.currentTime+(delay||0)+.01,i;
  switch(k){
    case 'move':nz(t,.03,2600,1700,.8,.55,.001);nz(t,.07,900,520,.7,.8,.002);tone(t,150,.09,.25,'sine',65);break;
    case 'hit':nz(t,.04,2200,1200,.8,.7,.001);tone(t,120,.18,.3,'sine',55);tone(t+.05,90,.2,.2,'sine',50);break;
    case 'off':nz(t,.04,3200,2200,1,.4,.001);tone(t,500,.06,.06,'sine',350);break;
    case 'dice':for(i=0;i<7;i++)nz(t+i*.07,.05,1800+Math.random()*1800,900,.9,.35+Math.random()*.2,.001);break;
    case 'bad':tone(t,150,.14,.2,'sine',85);break;
    case 'tap':tone(t,600,.05,.05,'sine');break;
    case 'pass':tone(t,300,.15,.1,'sine',200);break;
    case 'win':[523,659,784,1047,1319,1568].forEach(function(f,j){tone(t+j*.12,f,.5,.1,'triangle');tone(t+j*.12,f/2,.5,.05,'sine')});break;
    case 'lose':[392,349,311,262].forEach(function(f,j){tone(t+j*.2,f,.5,.1,'triangle')});break;
  }
}

/* ---------- قوانین ---------- */
/* نقطه‌ها ۱ تا ۲۴ از دید سفید شماره‌گذاری شده‌اند. سفید از ۲۴ به ۱ می‌رود (خانه‌اش ۱ تا ۶)،
   سیاه از ۱ به ۲۴ می‌رود (خانه‌اش ۱۹ تا ۲۴). عدد مثبت = سفید، منفی = سیاه */
function sg(p){return p==='w'?1:-1}
function opp(p){return p==='w'?'b':'w'}
function mkState(){
  var pts=new Array(25).fill(0);
  pts[24]=2;pts[13]=5;pts[8]=3;pts[6]=5;
  pts[1]=-2;pts[12]=-5;pts[17]=-3;pts[19]=-5;
  return {pts:pts,bar:{w:0,b:0},off:{w:0,b:0}};
}
function cp(s){return {pts:s.pts.slice(),bar:{w:s.bar.w,b:s.bar.b},off:{w:s.off.w,b:s.off.b}}}
function skey(s){return s.pts.join(',')+'|'+s.bar.w+s.bar.b+s.off.w+s.off.b}
function mine(s,p,i){return s.pts[i]*sg(p)>0}
function oc(s,p,i){return s.pts[i]*sg(p)<0?Math.abs(s.pts[i]):0}
function inHome(p,i){return p==='w'?i<=6:i>=19}
function dist(p,i){return p==='w'?i:25-i}
function allHome(s,p){
  if(s.bar[p])return false;
  for(var i=1;i<=24;i++)if(mine(s,p,i)&&!inHome(p,i))return false;
  return true;
}
function movesFor(s,p,die){
  var out=[],i,dest;
  if(s.bar[p]>0){
    dest=p==='w'?25-die:die;
    if(oc(s,p,dest)<2)out.push({from:'bar',to:dest,die:die});
    return out;
  }
  var home=allHome(s,p);
  for(i=1;i<=24;i++){
    if(!mine(s,p,i))continue;
    dest=p==='w'?i-die:i+die;
    if(dest>=1&&dest<=24){if(oc(s,p,dest)<2)out.push({from:i,to:dest,die:die})}
    else if(home){
      var need=dist(p,i);
      if(die===need)out.push({from:i,to:'off',die:die});
      else if(die>need){
        var far=false;
        for(var j=1;j<=24;j++)if(mine(s,p,j)&&dist(p,j)>need){far=true;break}
        if(!far)out.push({from:i,to:'off',die:die});
      }
    }
  }
  return out;
}
function applyMove(s,p,m){
  var n=cp(s),k=sg(p),q=opp(p);
  if(m.from==='bar')n.bar[p]--;else n.pts[m.from]-=k;
  if(m.to==='off')n.off[p]++;
  else{
    if(n.pts[m.to]*k<0){n.pts[m.to]=0;n.bar[q]++}
    n.pts[m.to]+=k;
  }
  return n;
}
function uniq(a){var o=[];a.forEach(function(x){if(o.indexOf(x)<0)o.push(x)});return o}
function removeOne(a,v){var i=a.indexOf(v),b=a.slice();if(i>=0)b.splice(i,1);return b}
function mkDepth(p){
  var memo={};
  function depth(s,r){
    if(!r.length)return 0;
    var key=skey(s)+'#'+r.join('');
    if(memo[key]!==undefined)return memo[key];
    var best=0;
    uniq(r).forEach(function(d){
      movesFor(s,p,d).forEach(function(m){
        var v=1+depth(applyMove(s,p,m),removeOne(r,d));
        if(v>best)best=v;
      });
    });
    memo[key]=best;return best;
  }
  return depth;
}
/* حرکت‌های مجاز بعدی؛ باید تا جای ممکن از هر دو تاس استفاده شود و اگر فقط یکی شدنی بود، تاس بزرگ‌تر */
function legalFirst(s,p,rem){
  var cands=[];
  uniq(rem).forEach(function(d){movesFor(s,p,d).forEach(function(m){cands.push(m)})});
  if(!cands.length)return [];
  var depth=mkDepth(p),best=0,info=[];
  cands.forEach(function(m){
    var v=1+depth(applyMove(s,p,m),removeOne(rem,m.die));
    info.push({m:m,v:v});if(v>best)best=v;
  });
  var out=info.filter(function(x){return x.v===best}).map(function(x){return x.m});
  if(best===1&&rem.length===2&&rem[0]!==rem[1]){
    var big=Math.max(rem[0],rem[1]);
    var wb=out.filter(function(m){return m.die===big});
    if(wb.length)out=wb;
  }
  return out;
}
function maxSeqs(s,p,rem){
  var depth=mkDepth(p),Mx=depth(s,rem),res={};
  function walk(st,r,seq){
    var need=Mx-seq.length;
    if(need===0){res[skey(st)]=seq;return}
    uniq(r).forEach(function(d){
      movesFor(st,p,d).forEach(function(m){
        var n=applyMove(st,p,m),r2=removeOne(r,d);
        if(1+depth(n,r2)===need)walk(n,r2,seq.concat([m]));
      });
    });
  }
  walk(s,rem,[]);
  var list=Object.keys(res).map(function(k){return res[k]});
  if(Mx===1&&rem.length===2&&rem[0]!==rem[1]){
    var big=Math.max(rem[0],rem[1]);
    var wb=list.filter(function(q){return q[0].die===big});
    if(wb.length)list=wb;
  }
  return list;
}

/* ---------- ربات ---------- */
function pipsOf(s,p){var n=s.bar[p]*25;for(var i=1;i<=24;i++){var c=s.pts[i]*sg(p);if(c>0)n+=c*dist(p,i)}return n}
function evalSt(s,p,hard){
  var q=opp(p),k=sg(p),sc=(pipsOf(s,q)-pipsOf(s,p));
  sc+=(s.off[p]-s.off[q])*12+(s.bar[q]-s.bar[p])*16;
  var run=0,prime=0;
  for(var i=1;i<=24;i++){
    var c=s.pts[i]*k;
    if(c>=2){sc+=inHome(p,i)?4:3;run++;if(run>prime)prime=run}else run=0;
    if(c===1){
      var shots=0;
      for(var j=1;j<=24;j++){
        var o=s.pts[j]*(-k);
        if(o>0){var d=q==='w'?(j-i):(i-j);if(d>=1&&d<=6)shots++}
      }
      if(s.bar[q]>0){var dd=q==='w'?(25-i):i;if(dd>=1&&dd<=6)shots+=2}
      sc-=Math.min(1,shots*.22)*(dist(p,i)*(hard?.7:.45)+8);
    }
  }
  if(hard&&prime>=3)sc+=prime*3;
  return sc;
}
function botPick(list){
  var d=G.dif;
  if(d===0)return list[Math.floor(Math.random()*list.length)];
  var best=-1e9,pick=list[0];
  list.forEach(function(seq){
    var s=G;seq.forEach(function(m){s=applyMove(s,'b',m)});
    var v=evalSt(s,'b',d===2)+(d===1?Math.random()*10:0);
    if(v>best){best=v;pick=seq}
  });
  return pick;
}

/* ---------- جریان بازی ---------- */
function controls(p){return G.mode==='friend'||p==='w'}
function newGame(mode){
  var s=mkState();
  G={mode:mode,dif:set.dif,pts:s.pts,bar:s.bar,off:s.off,turn:Math.random()<.5?'w':'b',phase:'roll',dice:[],rem:[],hist:[],sel:null,fm:[],dests:{},over:false,rolling:false,roller:'w',drot:[0,0]};
  clearTimeout(botT);
  home.style.display='none';game.style.display='flex';$('end').style.display='none';$('cont').style.display='none';
  buildBoard();
  info(G.turn==='w'?(mode==='bot'?'تو شروع می‌کنی':'بازیکن ۱ (سفید) شروع می‌کند'):(mode==='bot'?'ربات شروع می‌کند':'بازیکن ۲ (سیاه) شروع می‌کند'));
  startTurn();snd('tap');
}
function save(){if(G&&!G.over)lsSet('asan_bg_game',{mode:G.mode,dif:G.dif,pts:G.pts,bar:G.bar,off:G.off,turn:G.turn,phase:G.phase,dice:G.dice,rem:G.rem,roller:G.roller,drot:G.drot})}
function startTurn(){
  G.dice=[];G.rem=[];G.hist=[];G.sel=null;G.fm=[];G.dests={};G.rolling=false;
  var p=G.turn;G.roller=p;
  if(controls(p)){G.phase='roll'}
  else{G.phase='bot';render();botTurn();return}
  render();save();
}
function rollDice(p,cb){
  G.rolling=true;G.roller=p;G.phase=controls(p)?'rolling':'bot';
  snd('dice');
  var n=0,iv=setInterval(function(){
    G.dice=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)];
    G.drot=[Math.random()*30-15,Math.random()*30-15];
    n++;render();
    if(n>=Math.round(T(600)/70)||FAST&&n>=2){
      clearInterval(iv);G.rolling=false;
      var a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);
      G.dice=[a,b];G.rem=a===b?[a,a,a,a]:[a,b];render();cb(a,b);
    }
  },FAST?30:70);
}
function afterRoll(){
  var p=G.turn;
  G.fm=legalFirst(G,p,G.rem);
  if(!G.fm.length){
    info(controls(p)&&G.mode==='bot'?'حرکتی نداری!':'حرکتی ندارد!');snd('pass');
    G.phase='done';render();
    setTimeout(function(){if(G&&!G.over&&G.phase==='done')endTurn()},T(1400));
    return;
  }
  G.phase='move';info('یک مهره را انتخاب کن و روی جای نشان‌داده‌شده ببر');render();
}
function checkMore(){
  var p=G.turn;
  if(!G.rem.length){G.phase='done';G.fm=[];info('نوبتت تمام شد؛ «تمام» را بزن');render();return}
  G.fm=legalFirst(G,p,G.rem);
  if(!G.fm.length){G.phase='done';info('حرکت دیگری نداری؛ «تمام» را بزن');render();return}
  G.phase='move';render();
}
function endTurn(){
  if(!G||G.over)return;
  G.turn=opp(G.turn);G.rem=[];G.dice=[];
  startTurn();
  if(G.turn==='w'&&G.mode==='bot')info('نوبت توست؛ تاس بریز');
  else if(G.mode==='friend')info('نوبت '+(G.turn==='w'?'بازیکن ۱ (سفید)':'بازیکن ۲ (سیاه)')+'؛ تاس بریز');
  save();
}
function topEl(pt,color){
  var els=bd.querySelectorAll('.ck[data-pt="'+pt+'"]'),r=null;
  [].forEach.call(els,function(e){if(!color||e.classList.contains(color))r=e});
  return r;
}
function doMove(m){
  var p=G.turn,hitBefore=G.bar[opp(p)];
  G.hist.push({pts:G.pts.slice(),bar:{w:G.bar.w,b:G.bar.b},off:{w:G.off.w,b:G.off.b},rem:G.rem.slice(),dice:G.dice.slice()});
  /* مبدأ پرواز مهره برای انیمیشن */
  var src=topEl(m.from==='bar'?'bar':m.from,p);
  if(src){var r=src.getBoundingClientRect();FLY={x:r.left,y:r.top,dest:m.to,p:p}}
  var n=applyMove(G,p,m);
  G.pts=n.pts;G.bar=n.bar;G.off=n.off;G.rem=removeOne(G.rem,m.die);
  G.sel=null;G.dests={};
  var hit=G.bar[opp(p)]>hitBefore;
  snd(m.to==='off'?'off':(hit?'hit':'move'));
  if(G.off[p]>=15){render();endGame(p);return}
  if(controls(p)){checkMore();save()}else render();
}
function undo(){
  if(!G||G.over||G.phase==='bot'||!G.hist.length||(G.phase!=='move'&&G.phase!=='done'))return;
  var h=G.hist.pop();
  G.pts=h.pts;G.bar=h.bar;G.off=h.off;G.rem=h.rem;G.dice=h.dice;G.sel=null;G.dests={};
  FLY=null;snd('tap');checkMore();save();
}

/* ---------- نوبت ربات ---------- */
function botTurn(){
  info('ربات تاس می‌ریزد…');
  botT=setTimeout(function(){
    rollDice('b',function(){
      var seqs=maxSeqs(G,'b',G.rem);
      if(!seqs.length){info('ربات حرکتی ندارد');snd('pass');botT=setTimeout(function(){if(G&&!G.over)endTurn()},T(1300));return}
      var seq=botPick(seqs);
      info('ربات حرکت می‌کند…');
      (function step(i){
        if(!G||G.over)return;
        if(i>=seq.length){botT=setTimeout(function(){if(G&&!G.over)endTurn()},T(800));return}
        doMove(seq[i]);
        botT=setTimeout(function(){step(i+1)},T(800));
      })(0);
    });
  },T(700));
}

/* ---------- ابعاد و رسم صفحه ---------- */
function buildBoard(){
  var W=game.clientWidth,Hh=game.clientHeight,frame=7;
  var barW=Math.max(14,Math.round(W*.045));
  var pw=Math.floor((W-16-2*frame-barW)/12),d=Math.floor(pw*.94);
  var availH=Hh-42-62-26*2-8-100-20-12;
  var gap=Math.max(62,Math.round(d*2.4));
  var ph=Math.min(Math.floor(d*6),Math.floor((availH-2*frame-gap)/2));
  ph=Math.max(ph,d*3);
  var bw=12*pw+barW+2*frame,bh=2*ph+gap+2*frame;
  M={W:W,frame:frame,barW:barW,pw:pw,d:d,ph:ph,gap:gap,bw:bw,bh:bh};
  bd.style.width=bw+'px';bd.style.height=bh+'px';
  var tw=Math.round(bw*.4);
  $('trT').style.width=tw+'px';$('trB').style.width=tw+'px';
  $('trT').style.alignSelf='flex-end';$('trB').style.alignSelf='flex-end';
  $('trT').style.marginRight=Math.round((W-bw)/2)+'px';$('trB').style.marginRight=Math.round((W-bw)/2)+'px';
  /* SVG ثابت صفحه */
  var s='<svg class="bs" width="'+bw+'" height="'+bh+'" viewBox="0 0 '+bw+' '+bh+'">';
  s+='<rect x="0" y="0" width="'+bw+'" height="'+bh+'" rx="16" fill="#111"/>';
  s+='<rect x="2" y="2" width="'+(bw-4)+'" height="'+(bh-4)+'" rx="14" fill="#8f2f1e"/>';
  s+='<rect x="'+frame+'" y="'+frame+'" width="'+(bw-2*frame)+'" height="'+(bh-2*frame)+'" rx="6" fill="#fcc392"/>';
  for(var c=0;c<12;c++){
    var x=colX(c);
    var cT=(c%2===0)?'#f0a070':'#fddcc1',cB=(c%2===0)?'#fddcc1':'#f0a070';
    s+='<polygon points="'+x+','+frame+' '+(x+pw)+','+frame+' '+(x+pw/2)+','+(frame+ph)+'" fill="'+cT+'"/>';
    s+='<polygon points="'+x+','+(bh-frame)+' '+(x+pw)+','+(bh-frame)+' '+(x+pw/2)+','+(bh-frame-ph)+'" fill="'+cB+'"/>';
  }
  s+='<rect x="'+(frame+6*pw)+'" y="'+frame+'" width="'+barW+'" height="'+(bh-2*frame)+'" fill="#8f2f1e"/></svg>';
  M.svg=s;
  var ls=Math.floor(Math.min((bw-2*frame)*.9,(bh-2*frame)*.74));
  M.logo='<div class="blogo" style="left:'+Math.round((bw-ls)/2)+'px;top:'+Math.round((bh-ls)/2)+'px;width:'+ls+'px;height:'+ls+'px"></div>';
}
function colX(c){return M.frame+c*M.pw+(c>=6?M.barW:0)}
function colOf(p){return p<=12?12-p:p-13}
function isTop(p){return p>=13}
/* مختصات بالای-چپ‌ی مهره‌ی k‌ام روی نقطه‌ی p (با n مهره) */
function ckPos(p,k,n){
  var d=M.d,x=colX(colOf(p))+(M.pw-d)/2;
  var step=(n*d<=M.ph)?d:(M.ph-d)/Math.max(1,n-1);
  var y=isTop(p)?M.frame+k*step:M.bh-M.frame-d-k*step;
  return {x:x,y:y};
}
function barPos(color,k){
  var d=M.d,x=M.frame+6*M.pw+M.barW/2-d/2,mid=M.bh/2;
  return {x:x,y:color==='b'?mid-d-4-k*(d*.85):mid+4+k*(d*.85)};
}
function pointAt(px,py){
  var x=px,y=py;
  if(x<0||y<0||x>M.bw||y>M.bh)return null;
  var bx=M.frame+6*M.pw;
  if(x>=bx&&x<=bx+M.barW)return 'bar';
  var col=x<bx?Math.floor((x-M.frame)/M.pw):6+Math.floor((x-M.frame-M.barW-6*M.pw)/M.pw);
  col=Math.max(0,Math.min(11,col));
  var top=y<M.bh/2;
  return top?13+col:12-col;
}
function diceHTML(){
  if(!G.dice.length)return '';
  var h='',used=[false,false];
  if(!G.rolling&&G.rem.length<2||G.rem.length===0){
    if(G.dice[0]===G.dice[1]){used[0]=G.rem.length<=2;used[1]=G.rem.length===0}
    else{
      var r=G.rem.slice();
      [0,1].forEach(function(i){var k=r.indexOf(G.dice[i]);if(k<0)used[i]=true;else r.splice(k,1)});
    }
  }else if(!G.rolling&&G.dice[0]===G.dice[1]){used[0]=G.rem.length<=2;used[1]=G.rem.length===0}
  var left=G.roller==='w'?M.frame+M.pw*2.2:M.frame+M.pw*8.3,sz=Math.round(M.d*1.6),cy=M.bh/2-sz/2;
  [0,1].forEach(function(i){
    var x=left+i*(sz+10),y=cy+(i?8:-6);
    h+='<div class="die'+(used[i]?' used':'')+(G.rolling?' roll':'')+'" style="left:'+x+'px;top:'+y+'px;width:'+sz+'px;height:'+sz+'px;transform:rotate('+G.drot[i]+'deg)">'+dieSVG(G.dice[i])+'</div>';
  });
  return h;
}
function dieSVG(v){
  var P={1:[[50,50]],2:[[28,28],[72,72]],3:[[28,28],[50,50],[72,72]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[28,28],[72,28],[50,50],[28,72],[72,72]],6:[[28,24],[72,24],[28,50],[72,50],[28,76],[72,76]]};
  var s='<svg viewBox="0 0 100 100" width="100%" height="100%"><rect x="3" y="3" width="94" height="94" rx="18" fill="#fbf4e4" stroke="#1a1a1a" stroke-width="6"/>';
  P[v].forEach(function(p){s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="8.5" fill="#1a1a1a"/>'});
  return s+'</svg>';
}
function render(){
  if(!G||!M.svg)return;
  var h=M.svg+M.logo,i,k;
  /* منطقه‌ی نقطه‌های مقصد */
  if(G.sel!==null){
    Object.keys(G.dests).forEach(function(key){
      if(key==='off')return;
      var p=+key,x=colX(colOf(p)),y=isTop(p)?M.frame:M.bh-M.frame-M.ph;
      var hz=G.pts[p]*sg(G.turn)<0;
      h+='<div class="pz'+(hz?' hit':'')+'" style="left:'+x+'px;top:'+y+'px;width:'+M.pw+'px;height:'+M.ph+'px"></div>';
    });
  }
  /* مهره‌ها */
  for(i=1;i<=24;i++){
    var n=Math.abs(G.pts[i]);if(!n)continue;
    var col=G.pts[i]>0?'w':'b';
    for(k=0;k<n;k++){
      var pos=ckPos(i,k,n),isSel=(G.sel===i&&k===n-1);
      h+='<div class="ck '+col+(isSel?' sel':'')+'" data-pt="'+i+'" data-k="'+k+'" style="left:'+pos.x+'px;top:'+pos.y+'px;width:'+M.d+'px;height:'+M.d+'px"></div>';
    }
  }
  ['w','b'].forEach(function(c){
    for(k=0;k<G.bar[c];k++){
      var bp=barPos(c,k),selb=(G.sel==='bar'&&c===G.turn&&k===G.bar[c]-1);
      h+='<div class="ck '+c+(selb?' sel':'')+'" data-pt="bar" data-k="'+k+'" style="left:'+bp.x+'px;top:'+bp.y+'px;width:'+M.d+'px;height:'+M.d+'px"></div>';
    }
  });
  /* نشانگر مقصد */
  if(G.sel!==null){
    Object.keys(G.dests).forEach(function(key){
      if(key==='off')return;
      var p=+key,cnt=Math.abs(G.pts[p]),same=G.pts[p]*sg(G.turn)>0,n2=same?cnt+1:1,pos=ckPos(p,same?cnt:0,n2);
      var hm=G.pts[p]*sg(G.turn)<0;
      h+='<div class="mk'+(hm?' hit':'')+'" style="left:'+pos.x+'px;top:'+pos.y+'px;width:'+M.d+'px;height:'+M.d+'px"></div>';
    });
  }
  h+=diceHTML();
  bd.innerHTML=h;
  /* انیمیشن پرواز مهره */
  if(FLY){
    var f=FLY;FLY=null;
    var el=null;
    if(f.dest==='off'){}
    else{
      var cnt=Math.abs(G.pts[f.dest]);
      el=bd.querySelector('.ck[data-pt="'+f.dest+'"][data-k="'+(cnt-1)+'"]');
    }
    if(el){
      var r=el.getBoundingClientRect();
      el.style.transition='none';
      el.style.transform='translate('+(f.x-r.left)+'px,'+(f.y-r.top)+'px)';
      el.style.zIndex=20;
      requestAnimationFrame(function(){requestAnimationFrame(function(){
        el.style.transition='transform .28s cubic-bezier(.22,.8,.25,1)';el.style.transform='';
        setTimeout(function(){el.style.zIndex='';el.style.transition=''},330);
      })});
    }
  }
  /* ضربه‌ی مهره‌ی حریف: مهره‌ی روی نوار «پاپ» می‌کند */
  /* سینی‌ها */
  ['w','b'].forEach(function(c){
    var tr=c==='w'?$('trB'):$('trT'),t='';
    for(i=0;i<15;i++)t+='<i class="'+(i<G.off[c]?c:'')+'"></i>';
    tr.innerHTML=t;
  });
  var offT=(G.sel!==null&&G.dests.off);
  $('trB').className='tray'+(offT&&G.turn==='w'?' tgt':'');
  $('trT').className='tray'+(offT&&G.turn==='b'?' tgt':'');
  /* امتیاز */
  $('sa').textContent=String(G.off.w);$('sb').textContent=String(G.off.b);
  $('na').textContent=G.mode==='bot'?'تو':'بازیکن ۱';$('nb').textContent=G.mode==='bot'?'ربات':'بازیکن ۲';
  $('pa').className='p a'+(G.turn==='w'&&!G.over?' on':'');$('pb').className='p b'+(G.turn==='b'&&!G.over?' on':'');
  $('tag').textContent=G.mode==='bot'?DIFF[G.dif].n:'دو نفره';
  /* دکمه‌ها */
  var cr=$('crow'),b='';
  if(!G.over){
    if(G.phase==='roll')b='<button class="bigb roll" id="bRoll"><s>★</s><span>تاس بریز</span><s>★</s></button>';
    else if(G.phase==='done'&&controls(G.turn)&&G.dice.length){
      b='<button class="bigb done" id="bDone"><span style="flex:1;text-align:center">تمام</span></button>'+
        '<button class="ub" id="bUndo"'+(G.hist.length?'':' disabled')+'>↶</button>';
    }else if(G.phase==='move'){
      b='<button class="ub" id="bUndo"'+(G.hist.length?'':' disabled')+'>↶</button>';
    }
  }
  cr.innerHTML=b;
}
function info(t){$('info').innerHTML=t?'<span>'+t+'</span>':''}

/* ---------- لمس و کشیدن ---------- */
function canAct(){return G&&!G.over&&G.phase==='move'&&controls(G.turn)}
function selectable(pt){
  var p=G.turn;
  if(G.bar[p]>0)return pt==='bar'?G.fm.some(function(m){return m.from==='bar'}):false;
  if(pt==='bar'||pt===null)return false;
  return G.fm.some(function(m){return m.from===pt});
}
function setSel(pt){
  G.sel=pt;G.dests={};
  if(pt!==null){
    G.fm.filter(function(m){return m.from===pt}).forEach(function(m){
      var key=String(m.to);
      if(!G.dests[key]||m.die<G.dests[key].die)G.dests[key]=m;
    });
  }
  render();
}
function rel(e){var r=bd.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
bd.addEventListener('pointerdown',function(e){
  if(!canAct())return;
  var q=rel(e),pt=pointAt(q.x,q.y);
  D={pt:pt,x:e.clientX,y:e.clientY,moved:false,drag:false,ghost:null,sel0:G.sel};
  var isDest=(G.sel!==null&&pt!==null&&pt!=='bar'&&!!G.dests[String(pt)]);
  if(!isDest&&pt!==null&&selectable(pt)){
    if(G.sel!==pt)setSel(pt);
    D.drag=true;D.from=pt;
  }
  try{bd.setPointerCapture(e.pointerId)}catch(_){}
});
bd.addEventListener('pointermove',function(e){
  if(!D||!D.drag)return;
  var dx=e.clientX-D.x,dy=e.clientY-D.y;
  if(!D.moved&&Math.hypot(dx,dy)>9){
    D.moved=true;
    var g=document.createElement('div'),p=G.turn;
    g.className='ck '+p;g.style.cssText='position:fixed;z-index:300;width:'+M.d+'px;height:'+M.d+'px;pointer-events:none;box-shadow:0 8px 14px rgba(0,0,0,.35)';
    document.body.appendChild(g);D.ghost=g;
  }
  if(D.moved)D.ghost.style.left=(e.clientX-M.d/2)+'px',D.ghost.style.top=(e.clientY-M.d/2-34)+'px';
});
bd.addEventListener('pointerup',function(e){
  if(!D)return;
  var d=D;D=null;
  if(d.ghost)document.body.removeChild(d.ghost);
  var q=rel({clientX:e.clientX,clientY:e.clientY-(d.moved?34:0)}),pt=pointAt(q.x,q.y);
  if(d.moved){
    /* رها کردن: روی نقطه‌ی مقصد یا روی سینی */
    var mv=pt!==null&&pt!=='bar'?G.dests[String(pt)]:null;
    if(!mv&&G.dests.off){
      var tr=(G.turn==='w'?$('trB'):$('trT')).getBoundingClientRect(),pad=26;
      if(e.clientX>=tr.left-pad&&e.clientX<=tr.right+pad&&e.clientY-34>=tr.top-pad&&e.clientY-34<=tr.bottom+pad)mv=G.dests.off;
      if(e.clientX>=tr.left-pad&&e.clientX<=tr.right+pad&&e.clientY>=tr.top-pad&&e.clientY<=tr.bottom+pad)mv=G.dests.off;
    }
    if(mv)doMove(mv);else{snd('bad');setSel(null)}
    return;
  }
  /* لمس ساده: روی مقصد = حرکت؛ روی مهره‌ی انتخاب‌شده = لغو */
  if(pt!==null&&pt!=='bar'&&G.dests[String(pt)]){doMove(G.dests[String(pt)]);return}
  if(d.drag&&d.sel0===d.from){setSel(null);return}
  if(!d.drag&&G.sel!==null)setSel(null);
});
bd.addEventListener('pointercancel',function(){if(D&&D.ghost)document.body.removeChild(D.ghost);D=null});
function trayTap(c){
  return function(){if(canAct()&&G.sel!==null&&G.dests.off&&G.turn===c)doMove(G.dests.off)};
}
$('trB').addEventListener('click',trayTap('w'));
$('trT').addEventListener('click',trayTap('b'));
$('crow').addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t||!G)return;
  if(t.id==='bRoll'&&G.phase==='roll'&&controls(G.turn)){
    var p=G.turn;
    rollDice(p,function(){afterRoll()});
  }else if(t.id==='bDone'&&G.phase==='done'){snd('tap');endTurn()}
  else if(t.id==='bUndo')undo();
});
document.addEventListener('contextmenu',function(e){e.preventDefault()});

/* ---------- پنجره‌ها ---------- */
function toast(t){
  var el=$('toast');el.textContent=t;el.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show')},2300);
}
function modal(html){ov.innerHTML='<div class="dlg">'+html+'</div>';ov.className='show';ov.style.zIndex=120;return ov.firstChild}
function clearModal(){ov.className='';ov.innerHTML=''}
ov.addEventListener('click',function(e){if(e.target===ov)clearModal()});
function ask(msg,yes){
  var d=modal('<div class="msg">'+msg+'</div><div class="btns"><button id="y">بله</button><button id="n" class="alt">انصراف</button></div>');
  d.querySelector('#y').onclick=function(){clearModal();yes()};
  d.querySelector('#n').onclick=clearModal;
}
function openHelp(){
  var d=modal('<h2>راهنمای بازی</h2><div class="msg" style="text-align:right;line-height:1.9;font-size:14px">'+
    '<b>هدف:</b> هر ۱۵ مهره‌ی خودت را به خانه‌ات (۶ نقطه‌ی پایین سمت راست برای سفید) برسان و بعد همه را از صفحه بیرون ببر. اولین نفری که همه‌ی مهره‌هایش را بیرون ببرد برنده است.<br>'+
    '<b>حرکت:</b> تاس بریز. هر عدد، تعداد خانه‌ای است که یک مهره را می‌توانی جلو ببری. اگر جفت آوردی چهار بار حرکت می‌کنی. مهره‌ی سفید از بالا-راست به پایین-راست می‌چرخد.<br>'+
    '<b>مهره را انتخاب کن:</b> روی مهره بزن تا جاهای مجاز نشان داده شود، بعد آن را با انگشت بکش و روی جای نشان‌داده‌شده رها کن (یا روی آن جا بزن).<br>'+
    '<b>بسته بودن:</b> نمی‌توانی روی نقطه‌ای بروی که حریف دو مهره یا بیشتر دارد.<br>'+
    '<b>زدن:</b> اگر روی نقطه‌ای بروی که حریف فقط یک مهره دارد، آن مهره می‌افتد روی نوار وسط و حریف باید اول آن را به صفحه برگرداند.<br>'+
    '<b>بیرون بردن:</b> فقط وقتی همه‌ی مهره‌هایت در خانه‌ات باشد. با «تمام» نوبتت را تمام کن؛ با ↶ می‌توانی حرکتت را برگردانی.<br>'+
    '<b>قانون:</b> تا جایی که می‌شود باید از هر دو تاس استفاده کنی.</div>'+
    '<div class="btns"><button id="cl">بستن</button></div>');
  d.querySelector('#cl').onclick=clearModal;
}
function openSettings(){
  var d=modal('<h2>تنظیمات</h2>'+
    '<div class="row"><div>صدا و افکت‌ها</div><div class="tg'+(set.sound?' on':'')+'" id="tgs"></div></div>'+
    '<div class="btns"><button id="st">آمار</button><button id="cl" class="alt">بستن</button></div>');
  d.querySelector('#tgs').onclick=function(){set.sound=!set.sound;this.classList.toggle('on',set.sound);lsSet('asan_bg_set',set);if(set.sound)snd('tap')};
  d.querySelector('#cl').onclick=clearModal;
  d.querySelector('#st').onclick=openStats;
}
function openStats(){
  var d=modal('<h2>آمار</h2>'+
    '<div class="kv"><span>برد مقابل ربات</span><b>'+fa(stats.bw)+'</b></div>'+
    '<div class="kv"><span>باخت مقابل ربات</span><b>'+fa(stats.bl)+'</b></div>'+
    '<div class="kv"><span>بازی با دوست</span><b>'+fa(stats.fr)+'</b></div>'+
    '<div class="btns"><button id="cl">بستن</button></div>');
  d.querySelector('#cl').onclick=clearModal;
}

/* ---------- صفحه‌ی شروع و ادامه‌ی بازی ---------- */
function updHome(){
  var d=DIFF[set.dif];
  home.style.setProperty('--dc',d.col);home.style.setProperty('--dc2',d.col2);
  home.style.setProperty('--p',(set.dif/2*100)+'%');
  $('dslider').value=set.dif;$('dname').textContent=d.n;
}
function showHome(){clearTimeout(botT);game.style.display='none';$('end').style.display='none';home.style.display='flex';updHome()}
function resume(sv){
  var s={pts:sv.pts,bar:sv.bar,off:sv.off};
  G={mode:sv.mode,dif:sv.dif,pts:s.pts,bar:s.bar,off:s.off,turn:sv.turn,phase:'roll',dice:[],rem:[],hist:[],sel:null,fm:[],dests:{},over:false,rolling:false,roller:sv.turn,drot:sv.drot||[0,0]};
  clearTimeout(botT);
  home.style.display='none';game.style.display='flex';$('end').style.display='none';$('cont').style.display='none';
  buildBoard();
  if(sv.phase==='move'&&sv.rem&&sv.rem.length&&controls(sv.turn)){
    G.dice=sv.dice;G.rem=sv.rem;G.roller=sv.roller;
    G.fm=legalFirst(G,G.turn,G.rem);
    if(G.fm.length){G.phase='move';info('ادامه‌ی بازی؛ یک مهره را انتخاب کن');render();return}
  }
  startTurn();
  if(controls(G.turn))info('نوبت توست؛ تاس بریز');
}
function startMode(mode){
  var sv=lsGet('asan_bg_game',null);
  if(sv&&sv.mode===mode&&sv.pts&&!sv.over){
    $('cont').style.display='flex';
    $('cRs').onclick=function(){$('cont').style.display='none';try{localStorage.removeItem('asan_bg_game')}catch(e){}newGame(mode)};
    $('cCt').onclick=function(){$('cont').style.display='none';resume(sv)};
  }else newGame(mode);
}
$('dslider').addEventListener('input',function(){set.dif=+this.value;lsSet('asan_bg_set',set);updHome();snd('tap')});
$('pBot').onclick=function(){snd('tap');startMode('bot')};
$('pFr').onclick=function(){snd('tap');startMode('friend')};
$('hHelp').onclick=openHelp;$('hSet').onclick=openSettings;$('hStat').onclick=openStats;
$('gMenu').onclick=function(){snd('tap');save();showHome()};
$('gReset').onclick=function(){snd('tap');ask('بازی از اول شروع شود؟',function(){newGame(G.mode)})};
window.addEventListener('resize',function(){if(G&&game.style.display==='flex'&&!G.rolling){buildBoard();render()}});
showHome();
})();
</script>
