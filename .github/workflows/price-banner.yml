name: Price Banner

# ربات قیمت دلار و طلای آسان نت — هیچ عکسی ذخیره نمی‌شه؛ فقط یه «لینک بنر» تو content.json گذاشته می‌شه.
#   ۷ بار در روز (۸ ، ۱۰ ، ۱۲ ، ۱۴ ، ۱۶ ، ۱۸ ، ۲۰ به وقت تهران) یه آیتم قیمت جدید اضافه می‌شه
#   ۲۳:۳۰ تهران همه‌ی این آیتم‌ها پاک می‌شن و فردا صبح دوباره شروع می‌شه
# (ایران ساعت تابستانی نداره؛ ساعت UTC = ساعت تهران − ۳:۳۰. گیت‌هاب گاهی زمان‌بندی‌ها رو ۵ تا ۳۰ دقیقه
#  دیر اجرا می‌کنه. زمانِ نوشته‌شده روی بنر همون زمان واقعی دریافت قیمته.)

on:
  schedule:
    - cron: '30 4 * * *'
    - cron: '30 6 * * *'
    - cron: '30 8 * * *'
    - cron: '30 10 * * *'
    - cron: '30 12 * * *'
    - cron: '30 14 * * *'
    - cron: '30 16 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'fetch = ساخت یه بنر جدید، clean = پاک کردن بنرهای خودکار'
        type: choice
        options:
          - fetch
          - clean
        default: fetch

permissions:
  contents: write

concurrency:
  group: price-banner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run bot and commit changes
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '0 20 * * *' && 'clean' || 'fetch') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main --quiet
            git reset --hard origin/main --quiet
            python3 scripts/price_bot.py
            if git diff --quiet -- content.json; then
              echo "تغییری در content.json لازم نبود."
              exit 0
            fi
            git add content.json
            git commit -m "قیمت‌ها (خودکار): $MODE"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "ارسال ناموفق بود (احتمالاً هم‌زمان یه تغییر دیگه ثبت شده)؛ تلاش دوباره..."
            sleep 5
          done
          echo "::error::بعد از ۳ تلاش نتونستم تغییر رو ثبت کنم."
          exit 1

      - name: Save page screenshot for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: price-debug
          path: debug-page.png
          if-no-files-found: ignore
          retention-days: 2
