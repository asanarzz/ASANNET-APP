name: Weather Daily

# ربات آب‌وهوای آسان نت (مثل ربات قیمت — بدون عکس و بدون سرویس آپلود):
#   ساعت ۰۷:۰۰ تهران ← دمای همه‌ی شهرها رو می‌گیره و برای هر استان یه «لینک» تو content.json می‌ذاره
#   ساعت ۲۳:۳۰ تهران ← آیتم‌هایی که خودِ ربات ساخته پاک می‌شن
# اجرای دقیق‌ساعت: توسط Supabase (workflow_dispatch). cron های پایین فقط پشتیبانن.

on:
  schedule:
    - cron: '30 3 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'fetch = گرفتن آب‌وهوا، clean = پاک کردن آیتم‌های خودکار'
        type: choice
        options:
          - fetch
          - clean
        default: fetch

permissions:
  contents: write

concurrency:
  group: weather-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Run bot and commit changes
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '0 20 * * *' && 'clean' || 'fetch') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main --quiet
            git reset --hard origin/main --quiet
            python3 scripts/weather_bot.py
            if git diff --quiet -- content.json; then
              echo "تغییری در content.json لازم نبود."
              exit 0
            fi
            git add content.json
            git commit -m "آب‌وهوا (خودکار): $MODE"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "ارسال ناموفق بود (احتمالاً هم‌زمان تغییر دیگه‌ای ثبت شده)؛ تلاش دوباره..."
            sleep 5
          done
          echo "::error::بعد از ۳ تلاش نتونستم تغییر رو ثبت کنم."
          exit 1
