name: Weather Daily

# ربات آب‌وهوای آسان نت:
#   ۰۷:۰۰ تهران (۰۳:۳۰ UTC) ← آب‌وهوای همه‌ی شهرها رو می‌گیره، عکس بنرها (هر عکس ≤۱۵ شهر) رو می‌سازه،
#                              روی سرویس عکس آپلود می‌کنه و «فقط لینک‌ها» رو تو content.json (بخش آب و هوا) می‌نویسه
#   ۲۳:۳۰ تهران (۲۰:۰۰ UTC) ← همه‌ی آیتم‌هایی که خودِ ربات ساخته پاک می‌شن
# هیچ عکسی تو گیت‌هاب ذخیره نمی‌شه. (گیت‌هاب گاهی زمان‌بندی‌ها رو ۵ تا ۳۰ دقیقه دیر اجرا می‌کنه.)

on:
  schedule:
    - cron: '30 3 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'fetch = ساخت عکس‌ها و ثبت لینک‌ها، clean = پاک کردن آیتم‌های خودکار'
        type: choice
        options:
          - fetch
          - clean
        default: fetch

permissions:
  contents: write

concurrency:
  group: weather-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Decide mode
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then M="${{ inputs.mode }}"; elif [ "${{ github.event.schedule }}" = "0 20 * * *" ]; then M=clean; else M=fetch; fi
          echo "mode=$M" >> "$GITHUB_OUTPUT"

      - name: Install browser and fonts
        if: steps.m.outputs.mode == 'fetch'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji fonts-vazirmatn || true
          pip install playwright && python -m playwright install --with-deps chromium

      - name: Build banners and upload (only links are kept)
        if: steps.m.outputs.mode == 'fetch'
        env:
          MODE: generate
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          WEATHER_RESULT: ${{ runner.temp }}/weather_result.json
        run: python3 scripts/weather_bot.py

      - name: Write links to content.json and commit
        env:
          MODE: ${{ steps.m.outputs.mode == 'clean' && 'clean' || 'apply' }}
          WEATHER_RESULT: ${{ runner.temp }}/weather_result.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main --quiet
            git reset --hard origin/main --quiet
            python3 scripts/weather_bot.py
            if git diff --quiet -- content.json; then
              echo "تغییری در content.json لازم نبود."
              exit 0
            fi
            git add content.json
            git commit -m "آب‌وهوا (خودکار): $MODE"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "ارسال ناموفق بود (احتمالاً هم‌زمان تغییر دیگه‌ای ثبت شده)؛ تلاش دوباره..."
            sleep 8
          done
          echo "::error::بعد از ۴ تلاش نتونستم تغییر رو ثبت کنم."
          exit 1
