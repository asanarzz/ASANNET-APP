name: Build Android APK

# ─────────────────────────────────────────────────────────────
# نکته‌ی مهم:
# این ورک‌فلو فقط وقتی اجرا می‌شه که فایل‌های «کد» برنامه عوض بشن.
# یعنی وقتی از پنل مدیریت عکس/فیلم/لینک/آزمون اضافه می‌کنی
# (که فقط media/ و content.json رو تغییر می‌ده)، دیگه نسخه‌ی جدید ساخته نمی‌شه.
# ─────────────────────────────────────────────────────────────

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - '.build-trigger'
      - '.github/workflows/android-build.yml'
    tags: [ "v*" ]          # پوش تگ دستی همیشه بیلد می‌شه (فیلتر paths روی تگ اعمال نمی‌شه)
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - '.build-trigger'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:        # اجرای دستی و اجباری از تب Actions

permissions:
  contents: write

# اگه دو بیلد با هم شروع بشن، این‌ها به‌ترتیب (نه همزمان) اجرا می‌شن تا git push با هم تصادم نکنه.
concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # تور اطمینان دوم: کامیت‌های خودِ ربات ([skip ci]) باعث بیلد دوباره نمی‌شن.
    if: "!contains(github.event.head_commit.message || '', '[skip ci]')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # فقط موقع پوش مستقیم به main (یا اجرای دستی)، قبل از بیلد نسخه رو بالا می‌بریم.
      # اگه بیلد شکست بخوره، این تغییر هیچ‌وقت کامیت نمی‌شه (چون مرحله‌ی کامیت آخر کاره).
      - name: Bump version
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          CURRENT_CODE=$(grep -m1 'versionCode' app/build.gradle | grep -oE '[0-9]+')
          CURRENT_NAME=$(grep -m1 'versionName' app/build.gradle | sed -E 's/.*versionName *"([^"]+)".*/\1/')

          NEW_CODE=$((CURRENT_CODE + 1))

          MAJOR=$(echo "$CURRENT_NAME" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_NAME" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_NAME" | cut -d. -f3)

          PATCH=$((PATCH + 1))
          if [ "$PATCH" -gt 9 ]; then
            PATCH=0
            MINOR=$((MINOR + 1))
            if [ "$MINOR" -gt 9 ]; then
              MINOR=0
              MAJOR=$((MAJOR + 1))
            fi
          fi

          NEW_NAME="${MAJOR}.${MINOR}.${PATCH}"

          sed -i "s/versionCode $CURRENT_CODE/versionCode $NEW_CODE/" app/build.gradle
          sed -i "s/versionName \"$CURRENT_NAME\"/versionName \"$NEW_NAME\"/" app/build.gradle

          echo "نسخه‌ی قبلی: $CURRENT_NAME ($CURRENT_CODE)  ->  نسخه‌ی جدید: $NEW_NAME ($NEW_CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/kafinet-release.keystore

      - name: Build debug APK
        env:
          KAFINET_KEYSTORE_PATH: kafinet-release.keystore
          KAFINET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KAFINET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KAFINET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Remove keystore from runner
        if: always()
        run: rm -f app/kafinet-release.keystore

      - name: Read version name
        id: appversion
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle | sed -E 's/.*versionName *"([^"]+)".*/\1/')
          echo "برای این بیلد ورژن پیدا شد: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/ASANNET-v${{ steps.appversion.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASANNET-v${{ steps.appversion.outputs.version }}
          path: app/build/outputs/apk/debug/ASANNET-v${{ steps.appversion.outputs.version }}.apk

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/ASANNET-v${{ steps.appversion.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # فقط یک فایل ثابت latest.apk توی مخزن می‌مونه (برای دکمه‌ی «به‌روزرسانی برنامه»).
      # فایل نسخه‌دار دیگه تو مخزن کامیت نمی‌شه — به‌جاش تو Artifacts و Releases هست.
      - name: Copy APK for Pages download
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p apk
          cp "app/build/outputs/apk/debug/ASANNET-v${{ steps.appversion.outputs.version }}.apk" apk/latest.apk
          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle | grep -oE '[0-9]+')
          cat > apk/version.json << JSON_EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${{ steps.appversion.outputs.version }}",
            "apkUrl": "https://asanarzz.github.io/ASANNET-APP/apk/latest.apk"
          }
          JSON_EOF

      - name: Commit APK and bumped version to repo
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apk/latest.apk apk/version.json app/build.gradle
          git commit -m "بیلد موفق: نسخه v${{ steps.appversion.outputs.version }} [skip ci]" || echo "چیزی برای کامیت نبود"
          git pull --no-rebase --no-edit || true
          git push
